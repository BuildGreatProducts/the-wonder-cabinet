<title>Paper Plane Share</title>
<meta name="description" content="A share sheet as true 3D papercraft: the article folds itself into a paper plane in real fold steps, then you flick it to a friend standing on a white-paper horizon.">

<script type="application/json" id="component-meta">
{"name":"Paper Plane Share","reimagines":"Share button / share sheet","category":"Buttons & Actions","description":"Pressing Share makes the article page fold itself into a dart in real 3D — corners to the centre, edges again, keel, wings — lit like a white-paper studio set. Flick the plane toward one of the paper friends on the horizon (or the mailbox to copy the link) and it banks along an arc and lands at their feet.","hint":"Press Share, then flick the plane toward a friend"}

<style>
:root{ --ink:#2a2c33; --soft:#7a7e88; --paper:#f7f6f2; }

#gl{touch-action:none}
.ui{position:fixed;z-index:3}
.share{position:fixed;z-index:4;display:flex;align-items:center;gap:10px;font:600 15px "Instrument Sans",sans-serif;letter-spacing:.02em;color:var(--ink);background:var(--paper);border:0;padding:13px 22px 13px 16px;border-radius:3px;cursor:pointer;

<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="gl" aria-label="An article page that folds into a paper plane"></canvas>
<p class="top"><b>The Fold</b> · Essays · Issue 31</p>
<button class="share" id="share" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 11.5 21 4l-6.5 16-3.2-6.3z"/><path d="M11.3 13.7 21 4"/></svg>Share this essay</button>
<div class="picker" id="picker" role="group" aria-label="Choose who to send it to"></div>
<p class="hint" id="hint">Press Share and the page folds itself into a plane</p>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="nogl" id="nogl">This piece needs WebGL to fold paper.</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const easeOut = t => 1 - Math.pow(1-t, 3);

/* ---------------- vector / matrix helpers ---------------- */
const V = {
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.hypot(a[0],a[1],a[2]), norm:a=>{ const l = Math.hypot(a[0],a[1],a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; },
  lerp:(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)],
};
function rotAxis(p, o, k, th){ // rotate point p about line through o with unit dir k
  const v = V.sub(p, o), c = Math.cos(th), s = Math.sin(th), kv = V.cross(k, v), d = V.dot(k, v);
  return V.add(o, [v[0]*c + kv[0]*s + k[0]*d*(1-c), v[1]*c + kv[1]*s + k[1]*d*(1-c), v[2]*c + kv[2]*s + k[2]*d*(1-c)]);
}
function m3apply(m, p){ return [m[0]*p[0]+m[3]*p[1]+m[6]*p[2], m[1]*p[0]+m[4]*p[1]+m[7]*p[2], m[2]*p[0]+m[5]*p[1]+m[8]*p[2]]; }
function m3cols(u, v, z){ return [u[0],u[1],u[2], v[0],v[1],v[2], z[0],z[1],z[2]]; }
function m3mul(a, b){ const r = new Array(9); for (let c=0;c<3;c++) for (let rr=0;rr<3;rr++) r[c*3+rr] = a[rr]*b[c*3] + a[3+rr]*b[c*3+1] + a[6+rr]*b[c*3+2]; return r; }
function rx(t){ const c = Math.cos(t), s = Math.sin(t); return [1,0,0, 0,c,s, 0,-s,c]; }
function ry(t){ const c = Math.cos(t), s = Math.sin(t); return [c,0,-s, 0,1,0, s,0,c]; }
function rz(t){ const c = Math.cos(t), s = Math.sin(t); return [c,s,0, -s,c,0, 0,0,1]; }
function slerpM(a, b, t){ // slerp via quaternions
  const qa = toQ(a), qb = toQ(b); let d = qa[0]*qb[0]+qa[1]*qb[1]+qa[2]*qb[2]+qa[3]*qb[3];
  if (d < 0){ qb[0]=-qb[0]; qb[1]=-qb[1]; qb[2]=-qb[2]; qb[3]=-qb[3]; d = -d; }
  let q; if (d > .9995){ q = qa.map((x,i) => lerp(x, qb[i], t)); }
  else { const th = Math.acos(d), s = Math.sin(th), wa = Math.sin((1-t)*th)/s, wb = Math.sin(t*th)/s; q = qa.map((x,i) => x*wa + qb[i]*wb); }
  const l = Math.hypot(...q); return fromQ(q.map(x => x/l));
}
function toQ(m){ const t = m[0]+m[4]+m[8]; let w,x,y,z;
  if (t > 0){ const s = Math.sqrt(t+1)*2; w = .25*s; x = (m[5]-m[7])/s; y = (m[6]-m[2])/s; z = (m[1]-m[3])/s; }
  else if (m[0] > m[4] && m[0] > m[8]){ const s = Math.sqrt(1+m[0]-m[4]-m[8])*2; w = (m[5]-m[7])/s; x = .25*s; y = (m[3]+m[1])/s; z = (m[6]+m[2])/s; }
  else if (m[4] > m[8]){ const s = Math.sqrt(1+m[4]-m[0]-m[8])*2; w = (m[6]-m[2])/s; x = (m[3]+m[1])/s; y = .25*s; z = (m[7]+m[5])/s; }
  else { const s = Math.sqrt(1+m[8]-m[0]-m[4])*2; w = (m[1]-m[3])/s; x = (m[6]+m[2])/s; y = (m[7]+m[5])/s; z = .25*s; }
  return [w,x,y,z]; }
function fromQ([w,x,y,z]){ return [1-2*(y*y+z*z), 2*(x*y+w*z), 2*(x*z-w*y), 2*(x*y-w*z), 1-2*(x*x+z*z), 2*(y*z+w*x), 2*(x*z+w*y), 2*(y*z-w*x), 1-2*(x*x+y*y)]; }
function perspective(fy, a, n, f){ const t = 1/Math.tan(fy/2); return [t/a,0,0,0, 0,t,0,0, 0,0,(f+n)/(n-f),-1, 0,0,2*f*n/(n-f),0]; }
function lookAt(e, c, up){ const z = V.norm(V.sub(e, c)), x = V.norm(V.cross(up, z)), y = V.cross(z, x);
  return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0, -V.dot(x,e),-V.dot(y,e),-V.dot(z,e),1]; }
function m4mul(a, b){ const r = new Array(16); for (let c=0;c<4;c++) for (let rr=0;rr<4;rr++){ let s = 0; for (let k=0;k<4;k++) s += a[k*4+rr]*b[c*4+k]; r[c*4+rr] = s; } return r; }

/* ---------------- the sheet and its creases ---------------- */
const SW = 1, SL = 2.8; // half width, length (nose at v=0)
const LINES = {
  AL: {o:[0,0], d:V.norm([-1,1,0])}, AR: {o:[0,0], d:V.norm([1,1,0])},
  BL: {o:[0,0], d:V.norm([-0.41421,1,0])}, BR: {o:[0,0], d:V.norm([0.41421,1,0])},
};
const WING = .3;
function splitPoly(poly, key, o, n){ // returns [neg, pos] pieces; vertices carry several coordinate spaces
  const s = poly.map(p => (p[key][0]-o[0])*n[0] + (p[key][1]-o[1])*n[1]);
  const A = [], B = [];
  for (let i=0;i<poly.length;i++){
    const p = poly[i], q = poly[(i+1)%poly.length], sp = s[i], sq = s[(i+1)%poly.length];
    if (sp <= 0) A.push(p); if (sp >= 0) B.push(p);
    if ((sp < 0 && sq > 0) || (sp > 0 && sq < 0)){ const t = sp/(sp - sq), m = {}; for (const k in p) m[k] = [lerp(p[k][0], q[k][0], t), lerp(p[k][1], q[k][1], t)]; A.push(m); B.push(m); }
  }
  return [A.length >= 3 ? A : null, B.length >= 3 ? B : null];
}
function reflect(pt, o, d){ const v = [pt[0]-o[0], pt[1]-o[1]], k = v[0]*d[0] + v[1]*d[1]; return [o[0] + 2*k*d[0] - v[0], o[1] + 2*k*d[1] - v[1]]; }
function cutAll(list, key, o, n){
  const out = [];
  const cp = v => v.map(p => ({f:p.f.slice(), a:p.a.slice(), b:p.b.slice()}));
  for (const P of list){ const [neg, pos] = splitPoly(P.v, key, o, n); if (neg) out.push({...P, v:cp(neg)}); if (pos) out.push({...P, v:cp(pos)}); }
  return out;
}
const nrm = L => [-L.d[1], L.d[0]];
function buildSheet(){
  let polys = [{ v: [[-SW,0],[SW,0],[SW,SL],[-SW,SL]].map(p => ({f:p, a:p.slice(), b:p.slice()})), A:0, B:0, C:0, D:0 }];
  // step A: corners to the centre line
  polys = cutAll(polys, 'f', LINES.AL.o, nrm(LINES.AL)); polys = cutAll(polys, 'f', LINES.AR.o, nrm(LINES.AR));
  for (const P of polys){ if (centroidSide(P.v, 'f', LINES.AL) > 1e-6) P.A = -1; else if (centroidSide(P.v, 'f', LINES.AR) < -1e-6) P.A = 1; }
  for (const P of polys) for (const p of P.v) p.a = P.A === -1 ? reflect(p.f, LINES.AL.o, LINES.AL.d) : P.A === 1 ? reflect(p.f, LINES.AR.o, LINES.AR.d) : p.f.slice();
  // step B: the new slanted edges to the centre again
  polys = cutAll(polys, 'a', LINES.BL.o, nrm(LINES.BL)); polys = cutAll(polys, 'a', LINES.BR.o, nrm(LINES.BR));
  for (const P of polys){ if (centroidSide(P.v, 'a', LINES.BL) > 1e-6) P.B = -1; else if (centroidSide(P.v, 'a', LINES.BR) < -1e-6) P.B = 1; }
  for (const P of polys) for (const p of P.v) p.b = P.B === -1 ? reflect(p.a, LINES.BL.o, LINES.BL.d) : P.B === 1 ? reflect(p.a, LINES.BR.o, LINES.BR.d) : p.a.slice();
  // step C (keel) and D (wings) are cut in the folded-flat state
  polys = cutAll(polys, 'b', [0,0], [1,0]);
  for (const P of polys) P.C = centroidSide(P.v, 'b', {o:[0,0], d:[0,-1]}) < 0 ? -1 : 1;
  polys = cutAll(polys, 'b', [-WING,0], [1,0]); polys = cutAll(polys, 'b', [WING,0], [1,0]);
  for (const P of polys){ let cx = 0; P.v.forEach(p => cx += p.b[0]); cx /= P.v.length; P.D = cx < -WING ? -1 : cx > WING ? 1 : 0; P.C = cx < 0 ? -1 : 1; }
  return polys.filter(P => area(P.v.map(p => p.f)) > 1e-5);
}
function centroidSide(pts, key, L){ let cx = 0, cy = 0; pts.forEach(p => { cx += p[key][0]; cy += p[key][1]; }); cx /= pts.length; cy /= pts.length; const n = [-L.d[1], L.d[0]]; return (cx - L.o[0])*n[0] + (cy - L.o[1])*n[1]; }
function area(pts){ let a = 0; for (let i=0;i<pts.length;i++){ const p = pts[i], q = pts[(i+1)%pts.length]; a += p[0]*q[1] - q[0]*p[1]; } return Math.abs(a)/2; }
const SHEET = buildSheet();

// fold kinematics: A, B rotate flaps over their creases; D folds wings; C raises the halves
function foldPoint(p0, P, F){
  let p = [p0.f[0], p0.f[1], 0];
  const turn = (line, sign, amt) => { const o = [line.o[0], line.o[1], 0]; return rotAxis(p, o, line.d, sign*amt); };
  if (P.A && F.a > 0){ const L = P.A < 0 ? LINES.AL : LINES.AR; p = turn(L, P.A < 0 ? 1 : -1, F.a*(Math.PI - .045)); }
  if (P.B && F.b > 0){ const L = P.B < 0 ? LINES.BL : LINES.BR; p = turn(L, P.B < 0 ? 1 : -1, F.b*(Math.PI - .09)); }
  if (P.D && F.d > 0){ const o = [P.D*WING, 0, 0]; p = rotAxis(p, o, [0,1,0], P.D*F.d*(1.2)); }
  if (P.C && F.c > 0){ p = rotAxis(p, [0,0,0], [0,1,0], -P.C*F.c*1.42); }
  return p;
}

/* ---------------- WebGL ---------------- */
const gl = $('#gl').getContext('webgl', {alpha:true, antialias:true, premultipliedAlpha:true});
const bg = $('#bg'), bctx = bg.getContext('2d');
if (!gl){ $('#nogl').style.display = 'grid'; }
let prog, buf, tex, U = {};
function initGL(){
  const vs = `attribute vec3 p; attribute vec2 uv; attribute vec3 n; uniform mat4 M; varying vec2 vUv; varying vec3 vN; varying vec3 vW;
    void main(){ vUv = uv; vN = n; vW = p; gl_Position = M*vec4(p,1.); }`;
  const fs = `precision mediump float; varying vec2 vUv; varying vec3 vN; varying vec3 vW; uniform sampler2D tex; uniform vec3 L; uniform vec3 cam; uniform float fade;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec3 n = normalize(vN); if (!gl_FrontFacing) n = -n;
      vec3 v = normalize(cam - vW);
      float d = dot(n, L), diff = max(d, 0.), wrap = d*.5 + .5;
      vec3 paper = vec3(.972,.966,.95);
      vec3 print = texture2D(tex, vUv).rgb;
      vec3 base = gl_FrontFacing ? print : mix(paper, vec3(dot(texture2D(tex, vec2(1.-vUv.x, vUv.y)).rgb, vec3(.33))), .07);
      float trans = max(-d, 0.)*.18;               // light glowing through thin paper
      float spec = pow(max(dot(reflect(-L, n), v), 0.), 24.)*.05;
      float grain = (h(floor(vUv*900.)) - .5)*.025;
      vec3 key = vec3(1.,.92,.8), amb = vec3(.78,.8,.8);
      vec3 col = base*(amb*.62 + key*(.48*diff + .1*wrap) + trans) + spec*key + grain;
      gl_FragColor = vec4(col*fade, fade); }`;
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
  prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog); gl.useProgram(prog);
  ['M','L','cam','tex','fade'].forEach(k => U[k] = gl.getUniformLocation(prog, k));
  buf = gl.createBuffer(); tex = gl.createTexture();
  gl.enable(gl.DEPTH_TEST); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
}

/* ---------------- article texture ---------------- */
function articleTexture(){
  const c = document.createElement('canvas'); c.width = 1000; c.height = 1400; const g = c.getContext('2d');
  g.fillStyle = '#f8f7f3'; g.fillRect(0, 0, 1000, 1400);
  const ink = '#2a2c33';
  g.fillStyle = '#b4553a'; g.font = '600 26px "Instrument Sans", sans-serif'; g.fillText('ESSAY  ·  6 MIN READ', 80, 120);
  g.fillStyle = ink; g.font = '700 92px Fraunces, Georgia, serif';
  ['The quiet return', 'of the paper map'].forEach((l, i) => g.fillText(l, 76, 230 + i*100));
  g.fillStyle = '#6b6f78'; g.font = '500 28px "Instrument Sans", sans-serif'; g.fillText('By Ines Duarte  ·  4 Oct 2026', 80, 400);
  // contour-line illustration
  g.save(); g.beginPath(); g.rect(80, 450, 840, 360); g.clip();
  g.fillStyle = '#efece4'; g.fillRect(80, 450, 840, 360);
  g.strokeStyle = '#8b8f98'; g.lineWidth = 2.2;
  for (let i=0;i<12;i++){ g.beginPath(); for (let x=60; x<=940; x+=10){ const y = 760 - i*24 + Math.sin(x*.008 + i*.6)*30*(1 - i/16) + Math.sin(x*.021 + i)*12 - Math.max(0, 140 - Math.abs(x - 620)*.45)*(i/12); x === 60 ? g.moveTo(x, y) : g.lineTo(x, y); } g.stroke(); }
  g.strokeStyle = '#b4553a'; g.lineWidth = 4; g.setLineDash([12, 10]); g.beginPath(); g.moveTo(140, 780); g.bezierCurveTo(300, 700, 420, 760, 560, 640); g.bezierCurveTo(640, 590, 700, 600, 760, 520); g.stroke(); g.setLineDash([]);
  g.fillStyle = '#b4553a'; g.beginPath(); g.arc(760, 520, 10, 0, 7); g.fill();
  g.restore();
  g.fillStyle = ink; g.font = '400 30px Fraunces, Georgia, serif';
  const body = 'Folded maps never ran out of battery, and they never asked where you were. This autumn, outdoor shops in Lisbon and Leeds report their best map sales in a decade — bought, mostly, by people under thirty who grew up with blue dots. They want to see the whole valley at once, to argue over a ridge line, to fold the thing wrong and laugh about it.';
  wrap(g, body, 80, 870, 840, 44);
  g.strokeStyle = '#d8d4ca'; g.lineWidth = 2; g.beginPath(); g.moveTo(80, 1290); g.lineTo(920, 1290); g.stroke();
  g.fillStyle = '#6b6f78'; g.font = '500 24px "Instrument Sans", sans-serif'; g.fillText('THE FOLD  ·  ISSUE 31', 80, 1336); g.fillText('3', 900, 1336);
  return c;
}
function wrap(g, text, x, y, w, lh){ const words = text.split(' '); let line = ''; for (const wd of words){ const t = line ? line + ' ' + wd : wd; if (g.measureText(t).width > w){ g.fillText(line, x, y); y += lh; line = wd; } else line = t; } if (line) g.fillText(line, x, y); }
function uploadTex(){
  if (!gl) return; const c = articleTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

/* ---------------- scene ---------------- */
let W = 0, H = 0, DPR = 1, VP = null, camPos = [0, 3.4, 9], mobile = false, S = .78;
const LIGHT = V.norm([-.5, .6, .75]);
const CONTACTS = [
  {name:'Ines', full:'Ines Duarte', tint:'#d9694f', f:-.8, z:-9.6},

      g.beginPath(); g.moveTo(-26, 0); g.quadraticCurveTo(-28, -56, 0, -62); g.quadraticCurveTo(28, -56, 26, 0); g.closePath(); g.fill();
      g.beginPath(); g.arc(0, -84, 19, 0, 7); g.fill();
      g.shadowColor = 'transparent';
      g.fillStyle = c.tint; g.beginPath(); g.moveTo(-20, -52); g.quadraticCurveTo(0, -44, 20, -52); g.lineTo(18, -44); g.quadraticCurveTo(0, -36, -18, -44); g.closePath(); g.fill();
      g.fillRect(6, -48, 7, 22);
      // waving arm when they receive
      if (c.pop > 0){ g.save(); g.translate(22, -48); g.rotate(-1.2 + Math.sin(T*16)*.4); g.fillStyle = '#f7f6f2'; g.fillRect(-4, -30, 8, 32); g.restore(); }
    }
    // name tag
    g.shadowColor = 'rgba(55,55,75,.18)'; g.shadowBlur = 6*k*DPR; g.shadowOffsetY = 2*k*DPR;
    g.font = `600 ${mobile ? 17 : 15}px "Instrument Sans", sans-serif`; const label = c.type === 'mail' ? 'Copy link' : c.name; const tw = g.measureText(label).width + 16;
    g.fillStyle = i === aim ? '#2a2c33' : '#fbfaf7'; g.fillRect(-tw/2, 8, tw, 24);
    g.shadowColor = 'transparent'; g.fillStyle = i === aim ? '#fbfaf7' : '#2a2c33'; g.textAlign = 'center'; g.fillText(label, 0, 25);
    if (c.got){ g.fillStyle = '#b4553a'; g.beginPath(); g.arc(tw/2 - 2, 8, 8, 0, 7); g.fill(); g.fillStyle = '#fff'; g.font = '700 10px "Instrument Sans", sans-serif'; g.fillText(c.got, tw/2 - 2, 11.5); }
    g.restore();
    // aim ring
    if (i === aim){ g.save(); g.strokeStyle = 'rgba(42,44,51,.6)'; g.setLineDash([4*DPR, 5*DPR]); g.lineWidth = 1.5*DPR; g.beginPath(); g.ellipse(base[0]*DPR, base[1]*DPR, 40*k*DPR, 10*k*DPR, 0, 0, 7); g.stroke(); g.restore(); }
  }
  // planes that have landed rest at their feet
  for (const l of landed.slice(-8)){ const p = proj([l.x, l.y + .05, l.z]); const k = (proj([l.x, l.y + 1, l.z])[1] - p[1])*-1/60;
    g.save(); g.translate(p[0]*DPR, p[1]*DPR); g.scale(k*DPR, k*DPR); g.fillStyle = '#fbfaf7'; g.shadowColor = 'rgba(55,55,75,.25)'; g.shadowBlur = 6; g.shadowOffsetY = 2;
    g.beginPath(); g.moveTo(-26, 2); g.lineTo(26, -4); g.lineTo(-18, -10); g.closePath(); g.fill(); g.restore(); }
}
function drawAimArc(g){
  if (aim < 0 || state !== 'ready') return; const c = CONTACTS[aim], p0 = pose.P, p2 = [c.x, c.y + .6, c.z], mid = V.lerp(p0, p2, .5), p1 = [mid[0], Math.max(p0[1], p2[1]) + 3.2, mid[2]];
  g.save(); g.strokeStyle = 'rgba(42,44,51,.45)'; g.lineWidth = 1.6*DPR; g.setLineDash([2*DPR, 7*DPR]); g.lineCap = 'round'; g.beginPath();
  for (let t = 0; t <= 1.001; t += .04){ const s = proj(bez(p0, p1, p2, t)); t ? g.lineTo(s[0]*DPR, s[1]*DPR) : g.moveTo(s[0]*DPR, s[1]*DPR); } g.stroke(); g.restore();
}

let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  if (document.hidden){ last = now; return; }
  const dt = Math.min(.033, (now - last)/1000); last = now; T += dt;
  if (state === 'card'){ pose.R = cardRot(T); pose.P = CARD_POS(); fold.a = reduce ? restA : restA + Math.sin(T*1.3)*.07; }
  if (state === 'printing'){ cardY = Math.max(0, cardY - dt*2.2); pose.R = cardRot(T); pose.P = V.add(CARD_POS(), [0, -cardY*3, cardY*1.5]); }
  if (state === 'folding') stepFold(dt);
  if (state === 'ready' && !drag){ pose.R = planeRot(T); pose.P = V.add(HOLD_POS(), [0, Math.sin(T*1.6)*.06, 0]); }
  if (state === 'ready' && drag){ pose.R = planeRot(T, clamp((drag.hist[drag.hist.length-1].x - drag.x0)/400, -.5, .5)); }
  if (state === 'flying') stepFlight(dt);
  // compose
  const g = bctx; g.setTransform(1,0,0,1,0,0); g.drawImage(backdrop, 0, 0);
  drawContacts(g);
  const tris = (state === 'landed') ? [] : buildGeometry();
  if (tris.length) drawShadows(tris, g);
  drawAimArc(g);
  if (!gl) return;
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  if (!tris.length) return;
  gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.DYNAMIC_DRAW);
  const st = 32, pl = gl.getAttribLocation(prog, 'p'), ul = gl.getAttribLocation(prog, 'uv'), nl = gl.getAttribLocation(prog, 'n');
  gl.enableVertexAttribArray(pl); gl.vertexAttribPointer(pl, 3, gl.FLOAT, false, st, 0);
  gl.enableVertexAttribArray(ul); gl.vertexAttribPointer(ul, 2, gl.FLOAT, false, st, 12);
  gl.enableVertexAttribArray(nl); gl.vertexAttribPointer(nl, 3, gl.FLOAT, false, st, 20);
  gl.uniformMatrix4fv(U.M, false, new Float32Array(VP)); gl.uniform3fv(U.L, LIGHT); gl.uniform3fv(U.cam, camPos); gl.uniform1i(U.tex, 0); gl.uniform1f(U.fade, 1);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.drawArrays(gl.TRIANGLES, 0, verts.length/8);
}

if (gl){ initGL(); uploadTex(); }
layoutScene();
addEventListener('resize', () => { clearTimeout(layoutScene.t); layoutScene.t = setTimeout(layoutScene, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { uploadTex(); drawBackdrop(); placeUI(); });
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
