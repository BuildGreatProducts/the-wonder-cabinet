<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crumpled Paper Trash</title>
<meta name="description" content="Delete a note by crumpling it into a real 3D paper ball and tossing it into a felt bin; pull a ball back out and it unfolds onto the desk, creases and all.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=Patrick+Hand&display=swap" rel="stylesheet">
<script type="application/json" id="component-meta">
{"name":"Crumpled Paper Trash","reimagines":"Delete / restore","category":"Novel Interactions","description":"Hold a note and it crumples under your finger — a real cloth-style simulation of paper folding into a ball — then it is tossed into a felt bin on the floor. Pull a ball back out and it unfolds onto the desk, keeping the creases as an honest trace of having been deleted.","hint":"Hold a note to crumple it into the bin; drag a paper ball out of the bin to restore it"}
</script>
<style>
:root{
  --oak:#e4d3b8; --oak-deep:#cdb592; --floor:#d3d0ca; --felt:#8b8984; --ink:#2b2a27; --ink-soft:#6c675f; --tag:#b77d3f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--floor)}
body{font-family:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;overflow:hidden}
.floor{position:absolute;inset:0;background:
  radial-gradient(120% 90% at 85% 60%, rgba(255,255,255,.25), rgba(0,0,0,0) 60%),
  linear-gradient(180deg,#d6d3cd,#cbc7c0)}
.floor svg,.desk svg.grain{position:absolute;inset:0;width:100%;height:100%}
.desk{position:absolute;left:0;top:0;overflow:hidden;background:var(--oak);
  box-shadow: 0 0 0 1px rgba(120,90,50,.25), 18px 26px 40px rgba(60,45,30,.28), 6px 8px 10px rgba(60,45,30,.18)}
.desk::after{ /* the rounded oak edge catching window light */
  content:"";position:absolute;pointer-events:none;inset:0;
  box-shadow: inset -3px -3px 0 rgba(255,248,235,.55), inset -6px -6px 6px rgba(120,90,50,.18);
}
#shadows{position:absolute;inset:0;width:100%;height:100%;filter:blur(7px);opacity:.30;mix-blend-mode:multiply;pointer-events:none}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#gl.grabbing{cursor:grabbing}
.light{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(118deg, rgba(255,251,242,.42) 0%, rgba(255,251,242,.0) 46%),
    repeating-linear-gradient(118deg, rgba(0,0,0,0) 0 260px, rgba(70,58,44,.07) 260px 284px, rgba(0,0,0,0) 300px 560px),
    radial-gradient(140% 120% at 10% 0%, rgba(0,0,0,0) 50%, rgba(50,40,30,.12) 100%);
  mix-blend-mode:soft-light}
.prop{position:absolute;pointer-events:none}
.cup{width:128px;height:128px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, #fbfaf7 0 54%, #e9e6df 58%, #fbfaf7 63%, #f1eee8 100%);
  box-shadow: 10px 14px 18px rgba(60,45,30,.22), inset -4px -6px 10px rgba(0,0,0,.06)}
.cup::before{content:"";position:absolute;inset:26px;border-radius:50%;
  background:radial-gradient(circle at 46% 44%, #b98b5c 0 14%, #8a5a33 40%, #5b3a20 70%, #3e2615 100%);
  box-shadow: inset 0 0 0 5px #fbfaf7, inset 0 0 0 7px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.12)}
.cup::after{content:"";position:absolute;left:96px;top:44px;width:42px;height:30px;border-radius:0 18px 18px 0;border:9px solid #f7f5f0;border-left:0;box-shadow:6px 6px 8px rgba(60,45,30,.18)}
.card{position:absolute;padding:14px 44px 12px 18px;background:#fbfaf6;color:var(--ink);
  box-shadow: 0 1px 0 rgba(255,255,255,.8) inset, 4px 6px 10px rgba(60,45,30,.16), 1px 1px 2px rgba(60,45,30,.12);transform:rotate(-1deg)}
.card .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.card h1{margin:2px 0 4px;font-size:26px;font-weight:600;letter-spacing:-.01em}
.card .status{font-size:13px;color:var(--ink-soft)}
.card .status b{font-weight:600;color:var(--ink)}
.hint{position:absolute;font-size:13px;color:#5d5345;max-width:330px;line-height:1.4;transition:opacity .6s}
.hint i{font-style:normal;font-weight:600}
.tag{position:absolute;pointer-events:none;padding:4px 10px 5px 14px;border-radius:2px;background:linear-gradient(180deg,#c18849,#a96f33);
  color:#fbf1e3;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;box-shadow:2px 4px 6px rgba(40,25,10,.35);transform:translate(-50%,-50%) rotate(-4deg)}
.tag::before{content:"";position:absolute;left:5px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:#6b4320;box-shadow:inset 0 1px 1px rgba(0,0,0,.4)}
.mute{position:absolute;right:8px;top:8px;border:0;background:none;color:var(--ink-soft);cursor:pointer;padding:4px;pointer-events:auto}
.mute svg{width:16px;height:16px;display:block}
#a11y button{position:absolute;padding:0;margin:0;border:0;background:transparent;pointer-events:none;color:transparent;border-radius:4px}
#a11y button:focus-visible{outline:3px solid #2f6f62;outline-offset:6px}
.mute:focus-visible{outline:2px solid #2f6f62;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nogl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fbfaf6;padding:16px 20px;font-size:14px;box-shadow:4px 6px 12px rgba(0,0,0,.15);display:none}
</style>
</head>
<body>
<div id="stage">
  <div class="floor"><svg aria-hidden="true"><filter id="fl"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .43  0 0 0 0 .40  0 0 0 .22 0"/></filter><rect width="100%" height="100%" filter="url(#fl)"/></svg></div>
  <div class="desk" id="desk">
    <svg class="grain" aria-hidden="true" preserveAspectRatio="none"><filter id="oak" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".0025 .07" numOctaves="4" seed="9"/><feColorMatrix values="0 0 0 0 .62  0 0 0 0 .47  0 0 0 0 .30  0 0 0 -1.6 1.05"/></filter><rect width="100%" height="100%" filter="url(#oak)" opacity=".42"/><filter id="oak2"><feTurbulence type="fractalNoise" baseFrequency=".6 .02" numOctaves="2" seed="2"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .38  0 0 0 0 .25  0 0 0 .18 0"/></filter><rect width="100%" height="100%" filter="url(#oak2)"/></svg>
    <div class="prop cup" id="cup"></div>
    <svg class="prop" id="pencil" width="260" height="22" viewBox="0 0 260 22" aria-hidden="true"><defs><linearGradient id="pw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0dcb8"/><stop offset=".5" stop-color="#e2c393"/><stop offset="1" stop-color="#c9a674"/></linearGradient></defs><rect x="30" y="4" width="216" height="14" fill="url(#pw)"/><rect x="236" y="4" width="20" height="14" rx="2" fill="#2f2e2c"/><path d="M30 4 L4 11 L30 18 Z" fill="#e8cfa6"/><path d="M12 8.8 L4 11 L12 13.2 Z" fill="#3a3936"/><path d="M30 11 h206" stroke="rgba(120,90,50,.25)"/></svg>
    <svg class="prop" id="sprig" width="190" height="150" viewBox="0 0 190 150" aria-hidden="true"><path d="M10 140 C 60 100, 110 70, 182 18" stroke="#7d8a74" stroke-width="2" fill="none"/><g fill="#a9b8a0" stroke="#8c9c84" stroke-width=".8"><ellipse cx="40" cy="108" rx="15" ry="11" transform="rotate(-30 40 108)"/><ellipse cx="62" cy="104" rx="16" ry="12" transform="rotate(20 62 104)"/><ellipse cx="78" cy="80" rx="15" ry="11" transform="rotate(-40 78 80)"/><ellipse cx="102" cy="78" rx="16" ry="12" transform="rotate(15 102 78)"/><ellipse cx="118" cy="56" rx="14" ry="10" transform="rotate(-35 118 56)"/><ellipse cx="140" cy="52" rx="14" ry="11" transform="rotate(25 140 52)"/><ellipse cx="156" cy="32" rx="12" ry="9" transform="rotate(-30 156 32)"/><ellipse cx="174" cy="24" rx="10" ry="8"/></g></svg>
    <div class="card" id="card">
      <div class="eyebrow">Tuesday 7 October</div>
      <h1>Notes</h1>
      <div class="status" id="status"><b>5</b> on the desk · <b>0</b> in the bin</div>
      <button class="mute" id="mute" aria-label="Mute paper sounds" aria-pressed="false"><svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path id="mw" d="M11 5.5a3.4 3.4 0 0 1 0 5M13 3.5a6.2 6.2 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    </div>
    <p class="hint" id="hint"><i>Hold a note</i> to crumple it and toss it in the bin. <i>Pull a paper ball out</i> of the bin to restore it.</p>
  </div>
  <canvas id="shadows"></canvas>
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="tag" id="tag">Bin · 0</div>
  <div class="light"></div>
  <div id="a11y"></div>
  <p class="nogl" id="nogl">This desk needs WebGL 2 to show paper in 3D.</p>
  <p class="sr" id="live" aria-live="polite"></p>
</div>

<script>
(() => {
'use strict';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const cv = $('#gl'), shc = $('#shadows'), sx = shc.getContext('2d');
const gl = cv.getContext('webgl2', {antialias: true, alpha: true, premultipliedAlpha: true});
if (!gl){ $('#nogl').style.display = 'block'; return; }

/* ---------------- scene layout ---------------- */
const D = 1800;                      // camera height above the desk (px)
let firstDone = false;
const L3 = (() => { const v = [-0.45, -0.55, 0.75], m = Math.hypot(...v); return v.map(x => x/m); })();
const LX = -L3[0]/L3[2], LY = -L3[1]/L3[2]; // shadow offset per unit height
let VW = 0, VH = 0, dpr = 1, cam = {x:0, y:0}, mobile = false;
let desk = {w:0, h:0}, bin = {x:0, y:0, r:150, zf:-700, h:340}, NW = 200, NH = 220, BALL_R = 44;
const proj = (x, y, z) => { const k = D / (D - z); return [cam.x + (x - cam.x)*k, cam.y + (y - cam.y)*k, k]; };
const unproj = (sx_, sy_, z) => { const k = (D - z) / D; return [cam.x + (sx_ - cam.x)*k, cam.y + (sy_ - cam.y)*k]; };
const onDesk = (x, y, m = 0) => x > m && y > m && x < desk.w - m && y < desk.h - m;

const NOTES = [
  {text:'Call Astrid about the Malmö studio lease before Thursday', tag:'Calls', col:[247,245,240]},
  {text:'Book the cabin in Åre for the Q4 offsite, 14–16 Nov', tag:'Team', col:[227,232,220]},
  {text:'Return library books — due Friday 10 Oct', tag:'Errands', col:[239,230,214]},
  {text:'Oat milk, rye bread, lingonberries, coffee beans', tag:'Shopping', col:[242,227,221]},
  {text:'Send Fjord & Co. invoice — 12 400 kr, net 30', tag:'Work', col:[226,231,234]},
];
function slots(){
  if (!mobile) return [[175,262,-3],[430,240,2.2],[690,282,-1.6],[300,560,1.6],[566,578,-2.4]];
  const W = desk.w;
  return [[W*0.27,218,-3],[W*0.73,214,2.5],[W*0.27,366,2],[W*0.73,370,-2],[W*0.5,512,-1.5]];
}
function layout(){
  VW = innerWidth; VH = innerHeight; dpr = Math.min(2, devicePixelRatio || 1);
  mobile = VW < 760;
  cam = {x: VW/2, y: VH/2};
  cv.width = Math.round(VW*dpr); cv.height = Math.round(VH*dpr);
  shc.width = Math.round(VW*dpr); shc.height = Math.round(VH*dpr);
  const dk = $('#desk');
  if (!mobile){
    desk = {w: Math.min(VW - 340, Math.max(760, VW*0.7)), h: VH};
    NW = 200; NH = 220; BALL_R = 54;
    bin.r = 140; bin.h = 340; bin.zf = -700;
    const rimZ = bin.zf + bin.h, k = D/(D - rimZ);
    const want = {x: desk.w + (VW - desk.w)/2 + 10, y: VH*0.6};
    bin.x = cam.x + (want.x - cam.x)/k; bin.y = cam.y + (want.y - cam.y)/k;
  } else {
    desk = {w: VW, h: Math.round(Math.max(VH*0.7, 592))};
    NW = Math.min(140, VW*0.36); NH = NW*1.0; BALL_R = 40;
    bin.r = 96; bin.h = 260; bin.zf = -620;
    const rimZ = bin.zf + bin.h, k = D/(D - rimZ);
    const want = {x: VW/2, y: desk.h + (VH - desk.h)*0.5};
    bin.x = cam.x + (want.x - cam.x)/k; bin.y = cam.y + (want.y - cam.y)/k;
  }
  dk.style.width = desk.w + 'px'; dk.style.height = desk.h + 'px';
  const cup = $('#cup'), pen = $('#pencil'), spr = $('#sprig'), card = $('#card'), hint = $('#hint');
  if (!mobile){
    cup.style.display = pen.style.display = spr.style.display = '';
    cup.style.left = (desk.w - 190) + 'px'; cup.style.top = (desk.h - 230) + 'px';
    pen.style.left = '40px'; pen.style.top = (desk.h - 120) + 'px'; pen.style.transform = 'rotate(-14deg)';
    spr.style.left = (desk.w - 200) + 'px'; spr.style.top = '-6px';
    card.style.left = '44px'; card.style.top = '34px';
    hint.style.left = '330px'; hint.style.top = (desk.h - 92) + 'px';
  } else {
    pen.style.display = spr.style.display = 'none';
    cup.style.display = '';
    cup.style.left = (desk.w - 70) + 'px'; cup.style.top = '-40px';
    card.style.left = '14px'; card.style.top = '14px';
    hint.style.left = '16px'; hint.style.top = '114px';
    if (!firstDone) hint.innerHTML = '<i>Hold a note</i> to bin it. <i>Drag a ball out</i> to restore it.'; hint.style.maxWidth = (VW - 32) + 'px'; hint.style.fontSize = '12px';
  }
  const t = proj(bin.x, bin.y + bin.r*0.98, bin.zf + bin.h);
  const tag = $('#tag'); tag.style.left = t[0] + 'px'; tag.style.top = (t[1] + 2) + 'px';
}

/* ---------------- GL programs ---------------- */
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function prog(vs, fs){ const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; }
const VS_COMMON = `
uniform vec2 uCam; uniform float uD; uniform vec2 uHalf;
vec4 project(vec3 p){ float w = uD - p.z; return vec4((p.x - uCam.x) * uD / uHalf.x, -(p.y - uCam.y) * uD / uHalf.y, (-p.z / 3000.0) * w, w); }`;
const paperProg = prog(`#version 300 es
in vec3 aPos; in vec2 aUV; in float aAO;
${VS_COMMON}
out vec3 vPos; out vec2 vUV; out float vAO;
void main(){ gl_Position = project(aPos); vPos = aPos; vUV = aUV; vAO = aAO; }`,
`#version 300 es
precision highp float;
in vec3 vPos; in vec2 vUV; in float vAO;
uniform sampler2D uTex; uniform vec3 uL; uniform vec3 uBack; uniform vec2 uCam; uniform float uD;
out vec4 o;
void main(){
  vec3 n = normalize(-cross(dFdx(vPos), dFdy(vPos)));
  float wrap = 0.5 + 0.5 * dot(n, uL);
  vec3 base = gl_FrontFacing ? texture(uTex, vUV).rgb : uBack;
  vec3 col = base * (0.40 + 0.68 * wrap) * mix(0.5, 1.0, vAO);
  vec3 V = normalize(vec3(uCam, uD) - vPos);
  vec3 H = normalize(uL + V);
  col += vec3(0.05) * pow(max(dot(n, H), 0.0), 20.0);
  // faint translucency where paper faces away from the light
  col += base * 0.06 * max(-dot(n, uL), 0.0);
  o = vec4(col, 1.0);
}`);
const binProg = prog(`#version 300 es
in vec3 aPos; in vec3 aN; in float aKind;
${VS_COMMON}
out vec3 vPos; out vec3 vN; out float vKind;
void main(){ gl_Position = project(aPos); vPos = aPos; vN = aN; vKind = aKind; }`,
`#version 300 es
precision highp float;
in vec3 vPos; in vec3 vN; in float vKind;
uniform vec3 uL; uniform vec2 uCam; uniform float uD; uniform float uZF; uniform float uH; uniform vec4 uBalls[8]; uniform int uNB; uniform vec2 uLxy; uniform vec2 uBin; uniform float uBinR;
out vec4 o;
float h3(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vn(vec3 x){ vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(h3(i), h3(i+vec3(1,0,0)), f.x), mix(h3(i+vec3(0,1,0)), h3(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(h3(i+vec3(0,0,1)), h3(i+vec3(1,0,1)), f.x), mix(h3(i+vec3(0,1,1)), h3(i+vec3(1,1,1)), f.x), f.y), f.z); }
void main(){
  vec3 V = normalize(vec3(uCam, uD) - vPos);
  vec3 n = normalize(vN);
  bool inside = dot(n, V) < 0.0 && vKind < 0.5;
  if (inside) n = -n;
  float wrap = 0.5 + 0.5 * dot(n, uL);
  vec3 felt = vec3(0.66, 0.65, 0.63);
  if (vKind > 0.5 && vKind < 1.5) felt = vec3(0.50, 0.49, 0.47);
  if (vKind > 1.5) felt = vec3(0.74, 0.73, 0.71);
  float fib = vn(vPos * vec3(0.9, 0.9, 0.12)) * 0.5 + vn(vPos * 0.23) * 0.5;
  float fine = h3(floor(vPos * 2.3));
  felt *= 0.84 + 0.14 * fib + 0.09 * fine;
  // two handle slots cut through the felt near the rim
  if (vKind < 0.5){
    float ang = atan(vPos.y - uBin.y, vPos.x - uBin.x);
    float zr = uZF + uH;
    float hs = min(abs(ang), 3.14159 - abs(ang));
    if (vPos.z > zr - 62.0 && vPos.z < zr - 30.0 && hs < 0.2) felt *= 0.18;
  }
  float shade = 0.45 + 0.65 * wrap;
  if (inside) shade *= mix(0.30, 0.92, pow(clamp((vPos.z - uZF) / uH, 0.0, 1.0), 0.8));
  if (vKind > 1.5) shade = 0.95 + 0.25 * wrap;
  if (vKind > 0.5 && vKind < 1.5){
    float s = 1.0;
    for (int i = 0; i < 8; i++){ if (i >= uNB) break; vec4 b = uBalls[i];
      vec2 c = b.xy + uLxy * (b.z - uZF) * 0.35; float d = length(vPos.xy - c);
      s *= 1.0 - 0.55 * exp(-(d*d) / (b.w*b.w*0.9)); }
    float dc = length(vPos.xy - uBin);
    shade *= s * 0.62 * mix(1.0, 0.55, smoothstep(uBinR * 0.45, uBinR * 0.94, dc));
  }
  o = vec4(felt * shade, 1.0);
}`);
function loc(p, names){ const o = {}; names.forEach(n => o[n] = gl.getUniformLocation(p, n)); return o; }
const PU = loc(paperProg, ['uCam','uD','uHalf','uTex','uL','uBack']);
const BU = loc(binProg, ['uCam','uD','uHalf','uL','uZF','uH','uBalls','uNB','uLxy','uBin','uBinR']);

/* ---------------- paper mesh topology ---------------- */
const NX = 14, NY = 15, N = NX*NY;
const idx = (i, j) => j*NX + i;
const cons = [];
for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++){
  if (i < NX-1) cons.push(idx(i,j), idx(i+1,j));
  if (j < NY-1) cons.push(idx(i,j), idx(i,j+1));
  if (i < NX-1 && j < NY-1){ cons.push(idx(i,j), idx(i+1,j+1)); cons.push(idx(i+1,j), idx(i,j+1)); }
}
const CA = new Int32Array(cons), CR = new Float32Array(CA.length/2);
function restLengths(){
  for (let c = 0; c < CR.length; c++){
    const a = CA[c*2], b = CA[c*2+1];
    const ax = (a % NX)/(NX-1)*NW, ay = Math.floor(a/NX)/(NY-1)*NH, bx = (b % NX)/(NX-1)*NW, by = Math.floor(b/NX)/(NY-1)*NH;
    CR[c] = Math.hypot(bx-ax, by-ay);
  }
}
const tris = [];
for (let j = 0; j < NY-1; j++) for (let i = 0; i < NX-1; i++){ const a = idx(i,j), b = idx(i+1,j), c = idx(i,j+1), d = idx(i+1,j+1); tris.push(a,b,c, b,d,c); }
const IDX = new Uint16Array(tris);
const UV = new Float32Array(N*2); for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++){ UV[idx(i,j)*2] = i/(NX-1); UV[idx(i,j)*2+1] = j/(NY-1); }
const ibo = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, IDX, gl.STATIC_DRAW);
const uvb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, uvb); gl.bufferData(gl.ARRAY_BUFFER, UV, gl.STATIC_DRAW);
const A_POS = gl.getAttribLocation(paperProg, 'aPos'), A_UV = gl.getAttribLocation(paperProg, 'aUV'), A_AO = gl.getAttribLocation(paperProg, 'aAO');

/* ---------------- note textures ---------------- */
function noteTexture(n){
  const c = document.createElement('canvas'), S = 2, w = Math.round(NW*S), h = Math.round(NH*S);

    for (let a = 0; a < 3; a++){ const v = (P[j+a] - Q[j+a]) * 0.8; Q[j+a] = P[j+a]; P[j+a] += v + (T[j+a] - P[j+a]) * spring; }
    if (P[j+2] < 0.3) P[j+2] = 0.3;
    n.AO[i] += (1 - n.AO[i]) * 0.08;
  }
  satisfy(n, 3, 0.8 * (1 - k));
  if (rnd() < 0.25*(1 - k)) crackle(0.3*(1-k));
  if (k >= 1){ n.P.set(T); n.Q.set(T); n.AO.fill(1); n.state = 'flat'; n.dirty = true; return true; }
  return false;
}

/* ---------------- input ---------------- */
let held = null, now = performance.now();
function firstDelete(){ if (firstDone) return; firstDone = true; const h = $('#hint'); h.style.opacity = 0; setTimeout(() => { h.innerHTML = mobile ? '<i>Drag a paper ball out</i> of the bin to restore it.' : '<i>Pull a paper ball out</i> of the bin and drop it on the desk to restore the note.'; h.style.opacity = 1; }, 700); }
function pickBall(px, py){
  let best = null, bd = Infinity;
  for (const n of notes){ if (n.state !== 'bin' && n.state !== 'fly') continue; const p = proj(n.rb.x, n.rb.y, n.rb.z); const d = Math.hypot(p[0]-px, p[1]-py); if (d < n.ballR*p[2]*1.25 && d < bd){ bd = d; best = n; } }
  return best;
}
function pickNote(px, py){
  const [wx, wy] = unproj(px, py, 2);
  const list = notes.filter(n => n.state === 'flat').sort((a, b) => b.order - a.order);
  for (const n of list){ const c = Math.cos(-n.th), s = Math.sin(-n.th), dx = wx - n.cx, dy = wy - n.cy, lx = c*dx - s*dy, ly = s*dx + c*dy; if (Math.abs(lx) < NW/2 && Math.abs(ly) < NH/2) return n; }
  return null;
}
cv.addEventListener('pointerdown', e => {
  if (held || e.button > 0) return;
  audio();
  const px = e.clientX, py = e.clientY;
  const ball = pickBall(px, py);
  if (ball){
    ball.state = 'lift'; ball.order = order++; held = {n: ball, kind:'ball', x:px, y:py, hist:[]};
    cv.setPointerCapture(e.pointerId); cv.classList.add('grabbing'); crackle(.4); return;
  }
  const n = pickNote(px, py);
  if (n){
    const [wx, wy] = unproj(px, py, 2);
    held = {n, kind:'pending', x:px, y:py, sx:px, sy:py, t0:now, ox: n.cx - wx, oy: n.cy - wy};
    n.order = order++; n.dirty = true; cv.setPointerCapture(e.pointerId); cv.classList.add('grabbing');
  }
});
cv.addEventListener('pointermove', e => {
  if (!held) { const over = pickBall(e.clientX, e.clientY) || pickNote(e.clientX, e.clientY); cv.style.cursor = over ? 'grab' : 'default'; return; }
  held.x = e.clientX; held.y = e.clientY;
  held.hist.push && held.hist.push([now, e.clientX, e.clientY]);
  if (held.kind === 'pending' && Math.hypot(held.x - held.sx, held.y - held.sy) > 9){ held.kind = 'drag'; held.n.state = 'drag'; }
});
function release(){
  if (!held) return; const h = held, n = h.n; held = null; cv.classList.remove('grabbing');
  if (h.kind === 'pending'){ n.state = 'flat'; n.dirty = true; return; }
  if (h.kind === 'drag'){
    const tp = proj(bin.x, bin.y, bin.zf + bin.h);
    if (Math.hypot(h.x - tp[0], h.y - tp[1]) < bin.r*tp[2]*1.1){ startCrumple(n, n.cx, n.cy, true); return; }
    n.cx = Math.max(NW*0.5, Math.min(desk.w - NW*0.5, n.cx)); n.cy = Math.max(NH*0.5, Math.min(desk.h - NH*0.5, n.cy));
    n.state = 'flat'; flatPose(n, n.P); n.dirty = true; thud(.15); return;
  }
  if (h.kind === 'crumple'){
    if (n.state === 'crumple'){ // let go early: it springs back, a little more wrinkled
      addCreases(n, n.t*0.8); n.state = 'relax'; n.simT = 0; n.Q.set(n.P); flatPose(n, n.T); say('Let go early — the note is still on the desk.'); return; }
    if (n.state === 'held'){ toss(n); return; }
  }
  if (h.kind === 'ball'){
    const b = n.rb; const [wx, wy] = unproj(h.x, h.y, b.z);
    if (onDesk(wx, wy, 10)){ n.state = 'drop'; b.vx = b.vy = 0; b.vz = 0; return; }
    toss(n); say('Back in the bin.');
  }
}
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);

/* keyboard path */
const a11y = $('#a11y'); const btns = [];
notes.forEach(n => {
  const b = document.createElement('button'); b.type = 'button';
  b.setAttribute('aria-label', `Note: ${n.text}. Press Delete to crumple it into the bin.`);
  b.addEventListener('keydown', e => { if ((e.key === 'Delete' || e.key === 'Backspace') && n.state === 'flat'){ e.preventDefault(); audio(); startCrumple(n, n.cx, n.cy, true); } });
  a11y.appendChild(b); btns.push(b); n.btn = b;
});
const binBtn = document.createElement('button'); binBtn.type = 'button'; a11y.appendChild(binBtn);
binBtn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); audio(); restoreLatest(); } });
function restoreLatest(){
  const inBin = notes.filter(n => n.state === 'bin').sort((a, b) => b.binnedAt - a.binnedAt);
  if (!inBin.length){ say('The bin is empty.'); return; }
  const n = inBin[0], b = n.rb, tf = reduce ? 0.3 : 0.9;
  n.state = 'restore'; n.order = order++;
  const T = {x: n.home.x, y: n.home.y, z: n.ballR*0.85};
  b.vx = (T.x - b.x)/tf; b.vy = (T.y - b.y)/tf; b.vz = (T.z - b.z)/tf + 0.5*G*tf; b.wx = (rnd()-.5)*8; b.wy = (rnd()-.5)*8;
  n.restoreT = tf; whoosh();
}
function placeA11y(){
  notes.forEach(n => {
    const b = n.btn, show = n.state === 'flat' || n.state === 'relax' || n.state === 'drag';
    b.style.display = show ? '' : 'none'; b.tabIndex = show ? 0 : -1;
    b.style.left = (n.cx - NW/2) + 'px'; b.style.top = (n.cy - NH/2) + 'px'; b.style.width = NW + 'px'; b.style.height = NH + 'px';
    b.style.transform = `rotate(${n.th}rad)`;
  });
  const p = proj(bin.x, bin.y, bin.zf + bin.h), r = bin.r*p[2];
  Object.assign(binBtn.style, {left:(p[0]-r)+'px', top:(p[1]-r)+'px', width:2*r+'px', height:2*r+'px', borderRadius:'50%'});
}

/* ---------------- status ---------------- */
const live = $('#live'); let sayT = 0;
function say(t){ clearTimeout(sayT); sayT = setTimeout(() => live.textContent = t, 50); }
function updateStatus(){
  const inBin = notes.filter(n => ['fly','bin','lift','held'].includes(n.state)).length, onD = notes.length - inBin;
  $('#status').innerHTML = `<b>${onD}</b> on the desk · <b>${inBin}</b> in the bin`;
  $('#tag').textContent = `Bin · ${inBin}`;
  const h = $('#hint');
  if (onD === 0 && !h.dataset.clear){ h.dataset.clear = '1'; h.innerHTML = '<i>A clear desk.</i> Pull a ball out of the bin whenever you need a note back.'; }
  else if (onD > 0 && h.dataset.clear){ delete h.dataset.clear; h.innerHTML = mobile ? '<i>Drag a paper ball out</i> of the bin to restore it.' : '<i>Pull a paper ball out</i> of the bin and drop it on the desk to restore the note.'; }
  binBtn.setAttribute('aria-label', inBin ? `Bin with ${inBin} crumpled note${inBin>1?'s':''}. Press Enter to restore the most recent.` : 'Bin, empty.');
}

/* ---------------- render ---------------- */
function drawShadows(){
  sx.setTransform(dpr,0,0,dpr,0,0); sx.clearRect(0, 0, VW, VH);
  // bin on the floor
  const fb = proj(bin.x + bin.h*LX*0.5, bin.y + bin.h*LY*0.5, bin.zf);
  sx.fillStyle = 'rgba(30,24,18,.9)'; sx.beginPath(); sx.ellipse(fb[0], fb[1], bin.r*fb[2]*1.05, bin.r*fb[2]*1.05, 0, 0, Math.PI*2); sx.fill();
  for (const n of notes){
    if (n.state === 'bin' || n.state === 'fly' && n.rb && inBinXY(n.rb) && n.rb.z < bin.zf + bin.h) continue;
    if (n.rb){
      const b = n.rb; const over = onDesk(b.x, b.y) ? 0 : bin.zf; const hgt = Math.max(0, b.z - over);
      const p = proj(b.x + hgt*LX, b.y + hgt*LY, over), a = Math.max(0.15, 1 - hgt/900);
      sx.fillStyle = `rgba(30,24,18,${a})`; sx.beginPath(); sx.ellipse(p[0], p[1], n.ballR*p[2]*(0.9 + hgt/800), n.ballR*p[2]*(0.8 + hgt/800), 0.6, 0, Math.PI*2); sx.fill();
      continue;
    }
    sx.fillStyle = 'rgba(30,24,18,.95)';
    const P = n.P;
    sx.beginPath();
    for (let t = 0; t < IDX.length; t += 6){ // quads, coarse is fine under blur
      const a = IDX[t]*3, b = IDX[t+1]*3, c = IDX[t+4]*3, d = IDX[t+2]*3;
      sx.moveTo(P[a] + P[a+2]*LX + 2, P[a+1] + P[a+2]*LY + 3); sx.lineTo(P[b] + P[b+2]*LX + 2, P[b+1] + P[b+2]*LY + 3);
      sx.lineTo(P[c] + P[c+2]*LX + 2, P[c+1] + P[c+2]*LY + 3); sx.lineTo(P[d] + P[d+2]*LX + 2, P[d+1] + P[d+2]*LY + 3); sx.closePath();
    }
    sx.fill();
  }
}
function render(){
  gl.viewport(0, 0, cv.width, cv.height);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.frontFace(gl.CW); gl.disable(gl.CULL_FACE);
  // bin
  gl.useProgram(binProg);
  gl.uniform2f(BU.uCam, cam.x, cam.y); gl.uniform1f(BU.uD, D); gl.uniform2f(BU.uHalf, VW/2, VH/2);
  gl.uniform3f(BU.uL, L3[0], L3[1], L3[2]); gl.uniform1f(BU.uZF, bin.zf); gl.uniform1f(BU.uH, bin.h); gl.uniform2f(BU.uLxy, LX, LY); gl.uniform2f(BU.uBin, bin.x, bin.y); gl.uniform1f(BU.uBinR, bin.r);
  const balls = []; for (const n of notes){ if (n.rb && inBinXY(n.rb) && n.rb.z < bin.zf + bin.h + 60 && balls.length < 32) balls.push(n.rb.x, n.rb.y, n.rb.z, n.ballR); }
  const arr = new Float32Array(32); arr.set(balls.slice(0, 32)); gl.uniform4fv(BU.uBalls, arr); gl.uniform1i(BU.uNB, balls.length/4);
  gl.bindVertexArray(binVao); gl.drawArrays(gl.TRIANGLES, 0, binCount);
  // paper
  gl.useProgram(paperProg);
  gl.uniform2f(PU.uCam, cam.x, cam.y); gl.uniform1f(PU.uD, D); gl.uniform2f(PU.uHalf, VW/2, VH/2);
  gl.uniform3f(PU.uL, L3[0], L3[1], L3[2]); gl.uniform1i(PU.uTex, 0); gl.activeTexture(gl.TEXTURE0);
  for (const n of notes){
    gl.uniform3f(PU.uBack, n.col[0]/255*0.97, n.col[1]/255*0.97, n.col[2]/255*0.95);
    gl.bindVertexArray(n.vao);
    if (n.dirty || n.state !== 'flat'){
      gl.bindBuffer(gl.ARRAY_BUFFER, n.pb); gl.bufferSubData(gl.ARRAY_BUFFER, 0, n.P);
      gl.bindBuffer(gl.ARRAY_BUFFER, n.ab); gl.bufferSubData(gl.ARRAY_BUFFER, 0, n.AO);
      n.dirty = false;
    }
    gl.bindTexture(gl.TEXTURE_2D, n.tex);
    gl.drawElements(gl.TRIANGLES, IDX.length, gl.UNSIGNED_SHORT, 0);
  }
  gl.bindVertexArray(null);
}

/* ---------------- loop ---------------- */
let last = performance.now(), raf = 0, statusTick = 0;
function frame(t){
  now = t; const dt = Math.min(1/30, (t - last)/1000); last = t;
  if (held && held.kind === 'pending' && t - held.t0 > 170){
    held.kind = 'crumple'; const [wx, wy] = unproj(held.x, held.y, 2); startCrumple(held.n, wx, wy, false);
    if (reduce){ held.n.t = 0.999; }
  }
  for (const n of notes){
    switch (n.state){
      case 'crumple': {
        if (held && held.n === n){ const [wx, wy] = unproj(held.x, held.y, n.C.z); n.C.x += (wx - n.C.x)*0.25; n.C.y += (wy - n.C.y)*0.25; }
        stepCrumple(n, reduce ? 1 : dt); break; }
      case 'held': {
        const b = n.rb, [wx, wy] = unproj(held ? held.x : 0, held ? held.y : 0, 90);
        if (held){ const nx = b.x + (wx - b.x)*0.3, ny = b.y + (wy - b.y)*0.3; b.wx = (ny - b.y)*0.25; b.wy = -(nx - b.x)*0.25; b.x = nx; b.y = ny; b.z += (90 - b.z)*0.2; rotM(b.m, b.wx, b.wy, 0, dt*8); }
        writeRigid(n); break; }
      case 'lift': {
        const b = n.rb, zt = 140, [wx, wy] = unproj(held ? held.x : 0, held ? held.y : 0, b.z);
        const rimZ = bin.zf + bin.h; b.z += (zt - b.z)*(reduce ? 1 : 0.16);
        let tx = b.x + (wx - b.x)*0.3, ty = b.y + (wy - b.y)*0.3;
        if (b.z < rimZ + n.ballR){ const dx = tx - bin.x, dy = ty - bin.y, d = Math.hypot(dx, dy), m = bin.r*0.9 - n.ballR*0.8; if (d > m){ tx = bin.x + dx/d*m; ty = bin.y + dy/d*m; } }
        b.wx = (ty - b.y)*0.2; b.wy = -(tx - b.x)*0.2; rotM(b.m, b.wx, b.wy, 0, dt*8); b.x = tx; b.y = ty;
        writeRigid(n); break; }
      case 'fly': case 'bin': {
        if (n.state === 'bin' && n.rb.sleep > 0.6) break;
        stepBall(n, dt); writeRigid(n); break; }
      case 'drop': {
        const b = n.rb; b.vz -= G*dt; b.z += b.vz*dt; rotM(b.m, 2, 1, 0, dt);
        if (b.z <= n.ballR*0.85){ b.z = n.ballR*0.85; thud(.4); startUnfold(n, b.x, b.y); say(`Restored “${n.text}”.`); updateStatus(); }
        else writeRigid(n); break; }
      case 'restore': {
        const b = n.rb; b.vz -= G*dt; b.x += b.vx*dt; b.y += b.vy*dt; b.z += b.vz*dt; rotM(b.m, b.wx, b.wy, 0, dt); n.restoreT -= dt;
        if (n.restoreT <= 0 || b.z <= n.ballR*0.85){ b.z = n.ballR*0.85; thud(.4); startUnfold(n, b.x, b.y); say(`Restored “${n.text}”.`); updateStatus(); }
        else writeRigid(n); break; }
      case 'unfold': stepRelax(n, dt, reduce ? 0.05 : 1.3); break;
      case 'relax': stepRelax(n, dt, reduce ? 0.05 : 0.7); break;
      case 'drag': {
        if (held && held.n === n){ const [wx, wy] = unproj(held.x, held.y, 10); n.cx = wx + held.ox; n.cy = wy + held.oy; }
        flatPose(n, n.P, 9); n.dirty = true; break; }
    }
  }
  if (t - statusTick > 250){ statusTick = t; updateStatus(); placeA11y(); }
  drawShadows(); render();
  raf = requestAnimationFrame(frame);
}
function start(){ cancelAnimationFrame(raf); last = performance.now(); raf = requestAnimationFrame(frame); }
document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(raf); else start(); });

function rebuild(){
  layout(); restLengths(); buildBin();
  notes.forEach((n, i) => {
    if (n.state === 'flat' || n.state === 'relax' || n.state === 'drag'){ placeHome(n, i); n.state = 'flat'; }
    else if (n.state === 'bin' || n.state === 'fly'){ n.rb.x = bin.x + (rnd()-.5)*bin.r*0.6; n.rb.y = bin.y + (rnd()-.5)*bin.r*0.6; n.rb.z = bin.zf + bin.h*0.6; n.rb.sleep = 0; n.home = {x: slots()[i][0], y: slots()[i][1], th: 0}; }
    noteTexture(n);
  });
  placeA11y(); updateStatus();
}
let rsT = 0; addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(rebuild, 120); });
rebuild(); start();
document.fonts && document.fonts.ready.then(() => notes.forEach(noteTexture));
window.__paper = {notes, startCrumple, restoreLatest, toss};
})();
</script>
</body>
