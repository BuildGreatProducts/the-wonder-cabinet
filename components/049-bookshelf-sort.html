<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookshelf Sort</title>
<meta name="description" content="A sort control drawn as a New Yorker-style pen-and-ink cartoon: choose a sort and the books lift off the shelf and slide into their new order, with a caption to match.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script type="application/json" id="component-meta">
{"name":"Bookshelf Sort","reimagines":"Sort control / dropdown","category":"Pickers & Selection","description":"A reading log's sort menu becomes an inked, cross-hatched shelf. Pick title, author, year, pages or colour and each book lifts, travels and thunks down in its new place — the librarian-correct way (\"The\" is ignored), with a cartoon caption for every order and a cat who resents the disturbance.","hint":"Circle a sort order and watch the books reshelve themselves"}

<style>
:root{--ink:#1b1a18;--paper:#fbf8f1;--paper2:#f2ede1;--wash:#c9d6dc}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Libre Caslon Text",Georgia,serif;overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:48px;right:48px;top:30px;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;pointer-events:none}
.mast h1{font-family:"Libre Caslon Display",Georgia,serif;font-weight:400;font-size:58px;line-height:.95;letter-spacing:-.01em}
.mast p{font-variant:small-caps;letter-spacing:.12em;font-size:15px;margin-top:6px}
.sorts{pointer-events:auto;text-align:right}
.sorts .lbl{font-style:italic;font-size:15px;margin-bottom:6px}
.opts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.opt{appearance:none;background:none;border:0;cursor:pointer;font-family:"Libre Caslon Text",Georgia,serif;font-size:19px;color:var(--ink);padding:8px 12px;position:relative}
.opt svg{position:absolute;left:-6px;top:-4px;width:calc(100% + 12px);height:calc(100% + 8px);overflow:visible;pointer-events:none}
.opt svg path{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .55s cubic-bezier(.5,0,.3,1)}
.opt[aria-checked="true"] svg path{stroke-dashoffset:0}
.opt:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.opt:focus-visible{outline:1.5px dashed var(--ink);outline-offset:2px}
.dir{appearance:none;background:none;border:1.4px solid var(--ink);border-radius:40% 55% 45% 60%/55% 40% 60% 45%;cursor:pointer;width:42px;height:42px;margin-left:8px;display:grid;place-items:center}
.dir svg{transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.dir[aria-pressed="true"] svg{transform:rotate(180deg)}
.dir:focus-visible{outline:1.5px dashed var(--ink);outline-offset:3px}
.caption{position:fixed;left:0;right:0;text-align:center;font-style:italic;font-size:21px;pointer-events:none;transition:opacity .4s}
.caption.fade{opacity:0}
.card{position:fixed;width:300px;background:var(--paper);padding:18px 20px 16px;pointer-events:auto;transform-origin:50% 100%;transition:opacity .25s,transform .35s cubic-bezier(.3,1.5,.5,1);opacity:0;transform:translateY(10px) rotate(-2deg) scale(.96);z-index:4}
.card.on{opacity:1;transform:rotate(-1.2deg)}
.card svg.frame{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);overflow:visible;pointer-events:none}
.card h3{font-style:italic;font-weight:400;font-size:22px;line-height:1.1}
.card .by{font-variant:small-caps;letter-spacing:.08em;font-size:15px;margin-top:4px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px;margin-top:10px}
.card dt{font-style:italic}
.card .note{font-size:13.5px;margin-top:10px;line-height:1.4;border-top:1px solid var(--ink);padding-top:8px}
.card button{position:absolute;right:10px;top:8px;appearance:none;background:none;border:0;font-size:22px;cursor:pointer;font-family:inherit;line-height:1}
.card button:focus-visible{outline:1.5px dashed var(--ink)}
.mute{position:fixed;right:20px;bottom:18px;width:38px;height:38px;border-radius:50%;border:1.4px solid var(--ink);background:var(--paper);cursor:pointer;display:grid;place-items:center}
.mute:focus-visible{outline:1.5px dashed var(--ink);outline-offset:3px}
.hint{position:fixed;left:48px;bottom:22px;font-style:italic;font-size:15px;transition:opacity 1s}
.hint.gone{opacity:0}
.book{cursor:pointer;outline:none}
.book:focus-visible .focus{opacity:1}
.book .focus{opacity:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:760px){
  .top{left:16px;right:16px;top:14px;flex-direction:column;gap:10px}
  .mast h1{font-size:38px}.mast p{font-size:12.5px;margin-top:2px}
  .sorts{text-align:left;width:100%}.sorts .lbl{display:none}
  .opts{justify-content:flex-start;gap:0}.opt{font-size:15.5px;padding:7px 8px}.dir{width:34px;height:34px;margin-left:4px}
  .caption{font-size:16px;padding:0 18px}
  .card{width:min(300px,86vw)}
  .hint{left:16px;bottom:16px;font-size:13px;max-width:70%}
  .mute{right:12px;bottom:12px;width:34px;height:34px}
}
@media (prefers-reduced-motion:reduce){.opt svg path,.card{transition:none}}
</style>
</head>
<body>
<svg id="scene" aria-hidden="false" role="group" aria-label="Bookshelf">
  <defs>
    <pattern id="h45" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0.5Q2.5 0.1 5 0.6" stroke="#1b1a18" stroke-width=".8" fill="none"/></pattern>
    <pattern id="h45d" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0.4Q1.7 0 3.4 0.5" stroke="#1b1a18" stroke-width=".85" fill="none"/></pattern>
    <pattern id="hx" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)"><path d="M0 0.4Q1.7 0 3.4 0.5" stroke="#1b1a18" stroke-width=".7" fill="none"/></pattern>
    <pattern id="wall" width="9" height="160" patternUnits="userSpaceOnUse"><path d="M1 0Q1.6 80 1 160" stroke="#1b1a18" stroke-width=".5" fill="none" opacity=".35"/></pattern>
    <filter id="wc" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".08" numOctaves="2" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/><feGaussianBlur stdDeviation=".35"/></filter>
  </defs>
  <g id="wallG"></g>
  <g id="shelvesG"></g>
  <g id="shadowsG"></g>
  <g id="booksG"></g>
  <g id="catG"></g>
</svg>
<header class="top">
  <div class="mast"><h1>The Shelf</h1><p>Books I read in 2026 · eighteen volumes</p></div>
  <div class="sorts">
    <p class="lbl">Arrange the shelf by</p>
    <div class="opts" role="radiogroup" aria-label="Sort books by" id="opts"></div>
  </div>
</header>
<p class="caption" id="caption" aria-live="polite"></p>
<p class="hint" id="hint">Tap a sort order — or a book to take it down</p>
<div class="card" id="card" role="dialog" aria-modal="false" aria-labelledby="cTitle" hidden>
  <svg class="frame" id="cardFrame" aria-hidden="true"></svg>
  <button id="cClose" aria-label="Put the book back">×</button>
  <h3 id="cTitle"></h3><p class="by" id="cBy"></p>
  <dl><dt>Published</dt><dd id="cYear"></dd><dt>Pages</dt><dd id="cPages"></dd><dt>Finished</dt><dd id="cRead"></dd></dl>
  <p class="note" id="cNote"></p>
</div>
<button class="mute" id="mute" aria-pressed="false" aria-label="Mute sound"><svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 6.5h3l4-3.5v12l-4-3.5H2z" fill="#1b1a18"/><path id="mw" d="M12 5.5c1.8 1.8 1.8 5.2 0 7" stroke="#1b1a18" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></button>
<p class="sr" id="live" aria-live="polite"></p>

<script>
(()=>{
'use strict';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
const BOOKS=[
 ['Middlemarch','George Eliot','Eliot',1871,880,'#a9bf9a',190,'Jan','Slow, wise, and worth every one of its eight hundred pages.'],
 ['The Remains of the Day','Kazuo Ishiguro','Ishiguro',1989,258,'#5f7598',176,'Feb','A butler, a road trip, and the saddest restraint in English.'],
 ['Beloved','Toni Morrison','Morrison',1987,324,'#b8524a',198,'Mar','Read it twice. Will read it again.'],
 ['Mrs Dalloway','Virginia Woolf','Woolf',1925,194,'#b9a6cf',168,'Mar','One June day in London, from inside everyone’s head.'],
 ['One Hundred Years of Solitude','Gabriel García Márquez','García Márquez',1967,417,'#e2c35a',212,'Apr','Needed the family tree on the inside cover. Twice.'],
 ['The Overstory','Richard Powers','Powers',2018,502,'#7fa36a',220,'Apr','I now apologise to trees.'],
 ['Pachinko','Min Jin Lee','Lee',2017,490,'#e3907a',214,'May','Four generations; I cried on the 38 bus.'],
 ['Moby-Dick','Herman Melville','Melville',1851,635,'#5689b8',230,'Jun','The whale chapters are, in fact, the best chapters.'],
 ['Giovanni’s Room','James Baldwin','Baldwin',1956,169,'#cf9b4c',170,'Jun','Short, devastating, perfect.'],
 ['The Left Hand of Darkness','Ursula K. Le Guin','Le Guin',1969,304,'#8fc0c4',188,'Jul','Cold planet, warm book.'],
 ['Wolf Hall','Hilary Mantel','Mantel',2009,653,'#8c3b3b',226,'Aug','“He” is always Cromwell. Once you know, you know.'],
 ['Pride and Prejudice','Jane Austen','Austen',1813,432,'#e7a9bb',182,'Aug','Still funnier than most things published this year.'],
 ['Things Fall Apart','Chinua Achebe','Achebe',1958,209,'#e08a3c',174,'Sep','Plain sentences, enormous weight.'],
 ['The Hours','Michael Cunningham','Cunningham',1998,230,'#efe08c',172,'Sep','Read straight after Mrs Dalloway, as one should.'],
 ['Station Eleven','Emily St. John Mandel','Mandel',2014,333,'#7a5b9a',194,'Oct','The travelling symphony stayed with me for weeks.'],
 ['Anna Karenina','Leo Tolstoy','Tolstoy',1878,864,'#4a4a4f',224,'Nov','Team Levin, no notes.'],
 ['Piranesi','Susanna Clarke','Clarke',2020,245,'#5fa59a',184,'Nov','The House is beautiful, the House is kind.'],
 ['Klara and the Sun','Kazuo Ishiguro','Ishiguro',2021,303,'#f0b54e',186,'Dec','An Artificial Friend who made me cry. Again, Ishiguro.']
];
const SORTS=[
 {id:'title',name:'Title',key:b=>b.title.replace(/^(The|A|An)\s+/,'').toLowerCase(),cap:['Alphabetical, ignoring “The,” as nature intended.','Z to A. Somebody’s been rereading Zadie Smith.']},
 {id:'author',name:'Author',key:b=>b.sur.toLowerCase()+b.year,cap:['Every author in their place. Ishiguro gets two.','Surnames, in reverse. The librarian has left the building.']},
 {id:'year',name:'Year',key:b=>b.year,cap:['Two centuries of reading, in order, more or less briefly.','Newest first. Austen waits patiently at the end.']},
 {id:'pages',name:'Pages',key:b=>b.pages,cap:['From slim volumes to doorstops.','Doorstops first. The shelf groans approvingly.']},
 {id:'colour',name:'Colour',key:b=>b.hue,cap:['Not how a librarian would do it, but lovely.','A rainbow, backwards. Still lovely.']}
];
function hueOf(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx-mn<.08)return 400+(1-mx)*10;let h=mx===r?(g-b)/(mx-mn):mx===g?2+(b-r)/(mx-mn):4+(r-g)/(mx-mn);h*=60;if(h<0)h+=360;return h<345?h:h-360}
const books=BOOKS.map((b,i)=>({i,title:b[0],author:b[1],sur:b[2],year:b[3],pages:b[4],col:b[5],h:b[6],read:b[7],note:b[8],hue:hueOf(b[5]),w:16+b[4]/14,
  x:0,y:0,rot:0,anim:null,g:null,shadow:null}));

/* ---------- ink helpers ---------- */
function wob(a){return (rnd()-.5)*a}
function inkRect(x,y,w,h,j=1.2){// hand-drawn rectangle: four slightly curved strokes overshooting corners
  const o=()=>wob(j);const p=[];
  p.push(`M${x-1.5+o()} ${y+o()}Q${x+w/2} ${y+wob(j*1.4)} ${x+w+1.5+o()} ${y+o()}`);
  p.push(`M${x+w+o()} ${y-1.5+o()}Q${x+w+wob(j*1.4)} ${y+h/2} ${x+w+o()} ${y+h+1+o()}`);
  p.push(`M${x+w+1.5+o()} ${y+h+o()}Q${x+w/2} ${y+h+wob(j)} ${x-1.5+o()} ${y+h+o()}`);
  p.push(`M${x+o()} ${y+h+1.5+o()}Q${x+wob(j*1.4)} ${y+h/2} ${x+o()} ${y-1.5+o()}`);return p.join('')}
function washPath(x,y,w,h){const d=[];const n=6;let s=`M${x+wob(3)+1} ${y+wob(3)+2}`;for(let i=1;i<=n;i++)s+=`L${x+w*i/n+wob(2)} ${y+wob(3)+2}`;for(let i=1;i<=n;i++)s+=`L${x+w+wob(2)-1} ${y+h*i/n+wob(3)}`;for(let i=n-1;i>=0;i--)s+=`L${x+w*i/n+wob(2)} ${y+h+wob(2)-1}`;for(let i=n-1;i>0;i--)s+=`L${x+wob(2)+1} ${y+h*i/n+wob(3)}`;return s+'Z'}

/* ---------- build books ---------- */
let S=1;
function buildBooks(){
  const G=$('booksG'),SG=$('shadowsG');G.innerHTML='';SG.innerHTML='';
  books.forEach(b=>{seed=b.i*97+13;const w=b.w*S,h=b.h*S;
    const g=el('g',{class:'book',tabindex:0,role:'button','aria-label':`${b.title} by ${b.author}, ${b.year}, ${b.pages} pages`},G);
    // watercolour wash, slightly off-register with the ink
    el('path',{d:washPath(1.5,-h+1,w-2,h-2),fill:b.col,opacity:.72,filter:'url(#wc)',transform:`translate(${wob(2.5)} ${wob(2)})`},g);
    el('rect',{x:0,y:-h,width:w,height:h,fill:'transparent'},g);
    // shading: hatch the right third, cross-hatch the far edge
    el('path',{d:`M${w*.7} ${-h+2}L${w-1} ${-h+2}L${w-1} -1L${w*.7} -1Z`,fill:'url(#h45)'},g);
    el('path',{d:`M${w*.86} ${-h+2}L${w-1} ${-h+2}L${w-1} -1L${w*.86} -1Z`,fill:'url(#hx)'},g);
    // bands
    const band=(yy)=>el('path',{d:`M${1} ${yy}Q${w/2} ${yy+wob(1.2)} ${w-1} ${yy+wob(.8)}M1 ${yy+4*S}Q${w/2} ${yy+4*S+wob(1.2)} ${w-1} ${yy+4*S+wob(.8)}`,stroke:'#1b1a18','stroke-width':.9,fill:'none'},g);
    band(-h+12*S);band(-22*S);
    // ink outline
    el('path',{d:inkRect(0,-h,w,h),stroke:'#1b1a18','stroke-width':1.5,fill:'none','stroke-linecap':'round'},g);
    // title & author along the spine
    const fs=Math.max(8,Math.min(13*S,w*.42)),tl=h-60*S;
    const tt=el('text',{x:0,y:0,'font-family':'Libre Caslon Text, Georgia, serif','font-size':fs,fill:'#1b1a18','text-anchor':'middle',transform:`translate(${w*.47} ${-h/2-6*S}) rotate(-90)`,'dominant-baseline':'central','font-style':b.i%3===0?'italic':'normal'},g);
    tt.textContent=b.title;
    const au=el('text',{x:0,y:0,'font-family':'Libre Caslon Text, Georgia, serif','font-size':Math.max(6.5,fs*.62),fill:'#1b1a18','text-anchor':'middle',transform:`translate(${w*.47} ${-10*S}) rotate(0)`,'dominant-baseline':'central','letter-spacing':'.06em'},g);
    au.textContent=b.sur.split(' ')[0].slice(0,w>30*S?9:w>22*S?5:3).toUpperCase();b.auMax=w-5;
    el('rect',{class:'focus',x:-4,y:-h-4,width:w+8,height:h+8,fill:'none',stroke:'#1b1a18','stroke-width':1.2,'stroke-dasharray':'3 3'},g);
    b.g=g;b.tt=tt;b.au=au;b.ww=w;b.hh=h;
    // hatched cast shadow on the wall
    b.shadow=el('path',{d:`M0 0L${w} 0L${w+16*S} ${-h*.92}L${16*S} ${-h*.92}Z`,fill:'url(#h45d)',opacity:.55},SG);
    g.addEventListener('click',()=>openBook(b));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openBook(b);}});
  });
  requestAnimationFrame(fitTitles);
}
function fitTitles(){books.forEach(b=>{try{const al=b.au.getComputedTextLength();if(al>b.auMax){b.au.setAttribute('textLength',b.auMax);b.au.setAttribute('lengthAdjust','spacingAndGlyphs');}const max=b.hh-62*S;const len=b.tt.getComputedTextLength();if(len>max){b.tt.setAttribute('textLength',max);b.tt.setAttribute('lengthAdjust','spacingAndGlyphs');}else b.tt.removeAttribute('textLength');}catch(e){}});}

/* ---------- shelves & room ---------- */
let L={};
function layoutRoom(){
  const W=innerWidth,H=innerHeight,mob=W<=760;
  const raw=books.reduce((a,b)=>a+16+b.pages/14+1.5,0),CAT=100;
  S=mob?.66:Math.max(.7,Math.min(1.22,(W-140)/(raw+CAT+40)));
  const total=raw*S+CAT*S;
  const shelfInner=mob?W-60:Math.min(total+30*S,W-120);
  const rows=Math.max(1,Math.ceil(total/(shelfInner-10)));
  const maxH=236*S, rowGap=maxH+44*S;
  const hdr=document.querySelector('.top').getBoundingClientRect().bottom+16, avail=H-hdr-(mob?96:100);
  const firstShelfY=hdr+Math.max(0,(avail-rows*rowGap+44*S)/2)+maxH;
  L={W,H,mob,rows,shelfInner,x0:(W-shelfInner)/2,shelfY:[...Array(rows)].map((_,k)=>firstShelfY+k*rowGap)};
  const lastY=L.shelfY[rows-1];$('caption').style.top=(lastY+(mob?40:52)*Math.max(1,S))+'px';
  // wall
  const wg=$('wallG');wg.innerHTML='';seed=3;
  el('rect',{x:0,y:0,width:W,height:H,fill:'url(#wall)',opacity:.6},wg);
  // a framed picture and a window of hatching to set the room
  if(!mob){const hdrTop=document.querySelector('.top').getBoundingClientRect().bottom+8;const fx=L.x0+shelfInner-170,fy=L.shelfY[0]-maxH-104;if(fy>hdrTop){el('rect',{x:fx,y:fy,width:110,height:84,fill:'#fbf8f1'},wg);el('path',{d:inkRect(fx,fy,110,84,1.5)+inkRect(fx+8,fy+8,94,68,1),stroke:'#1b1a18','stroke-width':1.3,fill:'none'},wg);
    el('path',{d:`M${fx+14} ${fy+66}Q${fx+40} ${fy+30} ${fx+56} ${fy+52}T${fx+96} ${fy+40}`,stroke:'#1b1a18','stroke-width':1.1,fill:'none'},wg);el('circle',{cx:fx+80,cy:fy+24,r:7,fill:'#efd07a',opacity:.7},wg);el('path',{d:`M${fx+55} ${fy} L${fx+55} ${fy-26}`,stroke:'#1b1a18','stroke-width':1},wg);}}
  // shelves
  const sg=$('shelvesG');sg.innerHTML='';
  L.shelfY.forEach((y,k)=>{seed=40+k;const x=L.x0-26*S,w=shelfInner+52*S,t=16*S;
    el('rect',{x,y:y+t,width:w,height:t*1.4,fill:'url(#h45d)',opacity:.7},sg);
    el('rect',{x,y,width:w,height:t,fill:'#d7b98d',opacity:.55,filter:'url(#wc)'},sg);
    el('path',{d:inkRect(x,y,w,t,1.4),stroke:'#1b1a18','stroke-width':1.6,fill:'none'},sg);
    for(let i=0;i<5;i++){const yy=y+t*(.25+i*.14);let d=`M${x+8+rnd()*40} ${yy}`;for(let xx=x+60;xx<x+w-20;xx+=60+rnd()*40)d+=`Q${xx-20} ${yy+wob(2)} ${xx} ${yy+wob(1.4)}`;el('path',{d,stroke:'#1b1a18','stroke-width':.6,fill:'none',opacity:.7},sg);}
    // brackets
    for(const bx of [x+30*S,x+w-30*S]){el('path',{d:`M${bx} ${y+t}L${bx} ${y+t+36*S}Q${bx} ${y+t+4} ${bx+(bx<x+w/2?28:-28)*S} ${y+t}`,stroke:'#1b1a18','stroke-width':1.4,fill:'#fbf8f1'},sg);}
    // bookends
    for(const side of [-1,1]){const bx=side<0?L.x0-18*S:L.x0+shelfInner+2*S;const bh=70*S;const g=el('g',{transform:`translate(${bx} ${y})`},sg);
      el('path',{d:`M0 0L${16*S} 0L${16*S} ${-bh}Q${8*S} ${-bh-8*S} 0 ${-bh}Z`,fill:'#fbf8f1',stroke:'#1b1a18','stroke-width':1.4},g);el('path',{d:`M0 0L${16*S} 0L${16*S} ${-bh}Q${8*S} ${-bh-8*S} 0 ${-bh}Z`,fill:'url(#h45)',opacity:side<0?.25:.6},g);}
  });
}
function slots(order){// returns map book.i -> {x,y,row}
  const out={};let row=0,x=L.x0;
  for(const b of order){const w=b.ww+1.5*S;if(x+w>L.x0+L.shelfInner-6&&x>L.x0){row++;x=L.x0;}row=Math.min(row,L.rows-1);out[b.i]={x,y:L.shelfY[row],row};x+=w;}
  return out;
}

/* ---------- the cat ---------- */
let cat={x:0,y:0,hop:0,t:-1,awake:0};
function buildCat(){const g=$('catG');g.innerHTML='';const s=S;seed=77;
  const c=el('g',{id:'cat',style:'cursor:pointer'},g);
  el('path',{d:`M${-36*s} 0Q${-40*s} ${-30*s} ${-10*s} ${-34*s}Q${18*s} ${-38*s} ${30*s} ${-20*s}L${34*s} ${-30*s}L${38*s} ${-17*s}Q${44*s} ${-8*s} ${36*s} 0Z`,fill:'#fbf8f1',stroke:'#1b1a18','stroke-width':1.5},c);
  el('path',{d:`M${-36*s} 0Q${-40*s} ${-30*s} ${-10*s} ${-34*s}Q${18*s} ${-38*s} ${30*s} ${-20*s}L${34*s} ${-30*s}L${38*s} ${-17*s}Q${44*s} ${-8*s} ${36*s} 0Z`,fill:'url(#h45)',opacity:.55},c);
  el('path',{d:`M${-36*s} -2Q${-48*s} ${-4*s} ${-44*s} ${-16*s}Q${-40*s} ${-24*s} ${-30*s} ${-20*s}`,stroke:'#1b1a18','stroke-width':1.5,fill:'none',id:'tail'},c);
  el('path',{d:`M${26*s} ${-14*s}q3 2 6 0M${34*s} ${-14*s}q2 1.6 4 0`,stroke:'#1b1a18','stroke-width':1.2,fill:'none',id:'eyesC'},c);
  el('text',{x:44*s,y:-34*s,'font-family':'Libre Caslon Text, serif','font-style':'italic','font-size':14*s,fill:'#1b1a18',id:'zzz'},c).textContent='z';
  c.addEventListener('click',()=>{audio();mrrp();cat.t=performance.now();cat.awake=1;});
}

/* ---------- sound ---------- */
let AC=null,master=null,muted=false;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}master=AC.createGain();master.gain.value=muted?0:.18;master.connect(AC.destination);}if(AC.state==='suspended')AC.resume();return AC}
function thunk(w){if(!AC||AC.state!=='running')return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type='triangle';const fr=150-w*.9;o.frequency.setValueAtTime(fr,t);o.frequency.exponentialRampToValueAtTime(fr*.6,t+.08);
  f.type='lowpass';f.frequency.value=600;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(f).connect(g).connect(master);o.start(t);o.stop(t+.16);
  const n=Math.floor(AC.sampleRate*.03),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=AC.createBufferSource();s.buffer=b;const g2=AC.createGain();g2.gain.value=.16;const f2=AC.createBiquadFilter();f2.type='bandpass';f2.frequency.value=900;s.connect(f2).connect(g2).connect(master);s.start(t);}
function rustle(){if(!AC||AC.state!=='running')return;const t=AC.currentTime,n=Math.floor(AC.sampleRate*.22),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n)*(Math.random()<.5?1:.3);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=2500;const g=AC.createGain();g.gain.value=.08;s.connect(f).connect(g).connect(master);s.start(t);}
function mrrp(){const a=audio();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(420,t);o.frequency.linearRampToValueAtTime(620,t+.12);o.frequency.linearRampToValueAtTime(480,t+.3);f.type='bandpass';f.frequency.value=900;f.Q.value=3;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.34);o.connect(f).connect(g).connect(master);o.start(t);o.stop(t+.36);}
$('mute').addEventListener('click',()=>{muted=!muted;$('mute').setAttribute('aria-pressed',muted);$('mute').setAttribute('aria-label',muted?'Unmute sound':'Mute sound');$('mw').style.opacity=muted?.15:1;if(master)master.gain.value=muted?0:.18;});

/* ---------- sort controls ---------- */
let current='year',desc=false,order=[];
const optsEl=$('opts');
function circlePath(w,h){seed=Math.floor(Math.random()*999)+1;const cx=w/2,cy=h/2,rx=w/2,ry=h/2;let d='';const n=26,start=-2.4+wob(.4);
  for(let i=0;i<=n+3;i++){const a=start+i/n*Math.PI*2*1.08,k=1+wob(.06)+(i>n?.06:0);d+=(i?'L':'M')+(cx+Math.cos(a)*rx*k).toFixed(1)+' '+(cy+Math.sin(a)*ry*k).toFixed(1);}return d}
const optBtns=SORTS.map((s,i)=>{const b=document.createElement('button');b.className='opt';b.type='button';b.setAttribute('role','radio');b.setAttribute('aria-checked',String(s.id===current));b.tabIndex=s.id===current?0:-1;
  b.innerHTML=`${s.name}<svg aria-hidden="true" preserveAspectRatio="none"><path pathLength="1"/></svg>`;optsEl.appendChild(b);
  b.addEventListener('click',()=>choose(s.id));b.addEventListener('keydown',e=>{let k=0;if(e.key==='ArrowRight'||e.key==='ArrowDown')k=1;else if(e.key==='ArrowLeft'||e.key==='ArrowUp')k=-1;else return;e.preventDefault();const j=(i+k+SORTS.length)%SORTS.length;optBtns[j].focus();choose(SORTS[j].id);});return b;});
const dirBtn=document.createElement('button');dirBtn.className='dir';dirBtn.type='button';dirBtn.setAttribute('aria-pressed','false');dirBtn.setAttribute('aria-label','Reverse the order');
dirBtn.innerHTML='<svg width="18" height="22" viewBox="0 0 18 22" aria-hidden="true"><path d="M9 20Q8.4 11 9 2M3 8Q6 5 9 2Q12 5 15 8" fill="none" stroke="#1b1a18" stroke-width="1.6" stroke-linecap="round"/></svg>';
optsEl.appendChild(dirBtn);dirBtn.addEventListener('click',()=>{desc=!desc;dirBtn.setAttribute('aria-pressed',String(desc));dirBtn.setAttribute('aria-label',desc?'Order is reversed — switch back':'Reverse the order');apply(true);});
function drawCircles(){optBtns.forEach(b=>{const r=b.getBoundingClientRect();const sv=b.querySelector('svg');sv.setAttribute('viewBox',`0 0 ${r.width+12} ${r.height+8}`);b.querySelector('path').setAttribute('d',circlePath(r.width+12,r.height+8));});}
function choose(id){if(id===current&&order.length){desc=!desc;dirBtn.setAttribute('aria-pressed',String(desc));}current=id;
  optBtns.forEach((b,i)=>{const on=SORTS[i].id===id;b.setAttribute('aria-checked',String(on));b.tabIndex=on?0:-1;if(on){b.querySelector('path').setAttribute('d',circlePath(b.getBoundingClientRect().width+12,b.getBoundingClientRect().height+8));}});
  apply(true);$('hint').classList.add('gone');}
function sorted(){const s=SORTS.find(x=>x.id===current);const arr=[...books].sort((a,b)=>{const ka=s.key(a),kb=s.key(b);return ka<kb?-1:ka>kb?1:0});if(desc)arr.reverse();return arr}
function apply(animate){
  closeCard();const s=SORTS.find(x=>x.id===current);const next=sorted();const slot=slots(next);const now=performance.now();
  audio();if(animate&&!RM)rustle();
  next.forEach((b,k)=>{const t=slot[b.i];const dist=Math.hypot(t.x-b.x,t.y-b.y);
    if(!animate||RM||dist<.5){b.x=t.x;b.y=t.y;b.anim=null;return}
    const delay=k*38,dur=Math.min(1150,420+dist*.55),lift=34+Math.min(90,dist*.12)+(t.row!==Math.round((b.y-L.shelfY[0])/(L.shelfY[1]-L.shelfY[0]||1))?60:0);
    b.anim={x0:b.x,y0:b.y,x1:t.x,y1:t.y,t0:now+delay,dur,lift,tilt:(t.x>b.x?1:-1)*(4+Math.random()*5),landed:false};});
  order=next;
  books.forEach(b=>b.g.parentNode.appendChild(b.g));
  const cap=$('caption');cap.classList.add('fade');setTimeout(()=>{cap.textContent=s.cap[desc?1:0];cap.classList.remove('fade');},animate&&!RM?350:0);
  $('live').textContent=`Sorted by ${s.name.toLowerCase()}${desc?', reversed':''}. First: ${next[0].title}. Last: ${next[next.length-1].title}.`;
  // wake the cat
  if(animate){cat.t=now+120;cat.awake=1;}
  // keyboard order follows visual order
  next.forEach(b=>$('booksG').appendChild(b.g));
}

/* ---------- index card ---------- */
let openB=null;
function openBook(b){audio();if(openB===b){closeCard();return}closeCard(true);openB=b;rustle();
  const c=$('card');$('cTitle').textContent=b.title;$('cBy').textContent=b.author;$('cYear').textContent=b.year;$('cPages').textContent=b.pages;$('cRead').textContent=`${b.read} 2026`;$('cNote').textContent=b.note;
  c.hidden=false;const fr=$('cardFrame');requestAnimationFrame(()=>{const r=c.getBoundingClientRect();seed=b.i+5;fr.setAttribute('viewBox',`0 0 ${r.width+8} ${r.height+8}`);fr.innerHTML=`<path d="${inkRect(4,4,r.width,r.height,1.6)}" stroke="#1b1a18" stroke-width="1.5" fill="none"/><path d="M${r.width*.7} ${r.height+4}L${r.width+4} ${r.height+4}L${r.width+4} ${r.height*.4}" stroke="#1b1a18" stroke-width="3" fill="none" opacity=".8"/>`;
    const bx=b.x+b.ww/2;let left=Math.max(12,Math.min(innerWidth-r.width-12,bx-r.width/2));let top=b.y-b.hh-r.height-46;if(top<10)top=b.y+30;c.style.left=left+'px';c.style.top=top+'px';c.classList.add('on');});
  b.pull=performance.now();$('live').textContent=`${b.title}, ${b.author}. ${b.note}`;}
function closeCard(keep){if(!openB)return;const b=openB;openB=null;b.pull=-performance.now();const c=$('card');c.classList.remove('on');setTimeout(()=>{if(!openB)c.hidden=true;},260);}
$('cClose').addEventListener('click',()=>{const b=openB;closeCard();if(b)b.g.focus();});
addEventListener('keydown',e=>{if(e.key==='Escape'&&openB){const b=openB;closeCard();b.g.focus();}});

/* ---------- loop ---------- */
function frame(now){
  if(!document.hidden){
    books.forEach(b=>{let x=b.x,y=b.y,rot=0,lift=0;
      if(b.anim){const a=b.anim;let u=(now-a.t0)/a.dur;
        if(u<0){/* waiting */}
        else if(u<1){const e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;x=a.x0+(a.x1-a.x0)*e;y=a.y0+(a.y1-a.y0)*e;lift=Math.sin(Math.PI*Math.min(1,u*1.05))*a.lift;rot=Math.sin(Math.PI*u)*a.tilt;b.x=x;b.y=y;}
        else{if(!a.landed){a.landed=true;thunk(b.ww/S);a.tl=now;}const t2=(now-a.tl)/1000;x=a.x1;y=a.y1;b.x=x;b.y=y;lift=-Math.abs(Math.sin(t2*22))*Math.exp(-t2*9)*3;rot=Math.sin(t2*26)*Math.exp(-t2*8)*a.tilt*.4;if(t2>.6)b.anim=null;}}
      // pulled out for reading
      if(b.pull){const t=Math.min(1,(now-Math.abs(b.pull))/320);const k=b.pull>0?t:1-t;const e=k*k*(3-2*k);lift+=e*26*S;rot+=e*-7;if(b.pull<0&&t>=1)b.pull=0;}
      b.g.setAttribute('transform',`translate(${x.toFixed(2)} ${(y-lift).toFixed(2)}) rotate(${rot.toFixed(2)} ${b.ww/2} 0)`);
      b.shadow.setAttribute('transform',`translate(${(x+lift*.4).toFixed(2)} ${y.toFixed(2)})`);b.shadow.setAttribute('opacity',(.55-lift*.004).toFixed(3));
    });
    // cat
    const cg=document.getElementById('cat');if(cg){let hop=0,ears=0;if(cat.t>0){const t=(now-cat.t)/1000;if(t>0&&t<1.6){hop=Math.abs(Math.sin(t*7))*Math.exp(-t*2.4)*18*S;}if(t>2.4){cat.t=-1;cat.awake=0;}}
      cg.setAttribute('transform',`translate(${cat.x} ${cat.y-hop})`);const z=document.getElementById('zzz');if(z){z.setAttribute('opacity',cat.awake?0:(.5+.5*Math.sin(now/600)).toFixed(2));z.setAttribute('y',(-34*S-((now/40)%14)).toFixed(1));}
      const ey=document.getElementById('eyesC');if(ey)ey.setAttribute('d',cat.awake?`M${26*S} ${-15*S}a2 2 0 1 0 .1 0M${34*S} ${-15*S}a1.6 1.6 0 1 0 .1 0`:`M${26*S} ${-14*S}q3 2 6 0M${34*S} ${-14*S}q2 1.6 4 0`);
      const tl=document.getElementById('tail');if(tl)tl.setAttribute('transform',`rotate(${(Math.sin(now/(cat.awake?120:900))*(cat.awake?12:4)).toFixed(1)} ${-34*S} 0)`);}
  }
  requestAnimationFrame(frame);
}
function layoutAll(){layoutRoom();buildBooks();buildCat();const s=slots(sorted());books.forEach(b=>{const t=s[b.i];b.x=t.x;b.y=t.y;b.anim=null;});order=sorted();
  // the cat sleeps on top of the tallest book row's end bookend
  const lastRow=L.rows-1;const used=order.filter(b=>s[b.i].row===lastRow);const endX=used.length?s[used[used.length-1].i].x+used[used.length-1].ww:L.x0;
  const room=L.x0+L.shelfInner-endX;
  if(room>84*S){cat.x=endX+Math.min(room/2,54*S)+4*S;cat.y=L.shelfY[lastRow];}
  else{const first=order.filter(b=>s[b.i].row===0).slice(0,4);cat.x=s[first[1].i].x;cat.y=L.shelfY[0]-Math.max(...first.map(b=>b.hh))-1;}
  drawCircles();}
let rt=0;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{closeCard();layoutAll();},150);});
layoutAll();$('caption').textContent=SORTS.find(x=>x.id===current).cap[0];
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{fitTitles();drawCircles();});
requestAnimationFrame(frame);
window.__shelf={choose,open:i=>openBook(books[i]),reverse:()=>dirBtn.click()};
})();
</script>
</body>
