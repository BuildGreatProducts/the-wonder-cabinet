<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draw Your Guess Chart</title>
<meta name="description" content="A line chart you finish yourself: sketch your guess of the trend in felt-tip marker on graph paper, then reveal the real data, highlighter-shaded where you were off, and get scored.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<script type="application/json" id="component-meta">
{"name":"Draw Your Guess Chart","reimagines":"Line chart","category":"Data & Visualization","description":"A line chart drawn in felt-tip marker on graph paper that hides the recent past: you sketch your guess with a squeaky marker, then the real line inks itself in, the gap gets highlighter-shaded and you're scored against the team. Three charts, each with a surprise.","hint":"Draw your guess of the rest of the line, then press Show me how it went"}
</script>
<style>
  :root{
    --paper:#fbfaf3; --grid:rgba(66,135,196,.24); --ink:#202027; --blue:#1d5fc4; --red:#d8392b; --green:#16884a; --hi:#ffe45a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper)}
  body{font-family:Kalam, "Comic Sans MS", cursive;color:var(--ink)}
  .stage{position:relative;width:100vw;height:100dvh;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .ink{mix-blend-mode:multiply}
  .head{position:absolute;left:110px;top:26px;right:330px;pointer-events:none}
  h1{font:400 40px/1 "Permanent Marker", Kalam, cursive;margin:0;letter-spacing:.01em;color:var(--ink)}
  .sub{font:700 21px/1.25 Kalam, cursive;margin:10px 0 0;color:var(--blue)}
  .sub b{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:rgba(29,95,196,.45)}
  .prompt{font:400 18px/1.3 Kalam, cursive;margin:4px 0 0;color:#3a3a44}
  .rounds{position:absolute;top:30px;right:40px;display:flex;gap:10px;align-items:center}
  .rounds span{font:700 15px Kalam,cursive;color:#55555f;margin-right:4px}
  .hand{font:700 17px/1 Kalam, cursive;color:var(--ink);background:transparent;cursor:pointer;
    border:2.5px solid var(--ink);border-radius:255px 18px 225px 18px/18px 225px 18px 255px;padding:10px 18px 8px;
    transition:transform .12s, background .2s, color .2s, opacity .2s;position:relative}
  .hand:hover:not(:disabled){transform:rotate(-1.2deg) translateY(-1px);background:rgba(255,228,90,.55)}
  .hand:active:not(:disabled){transform:rotate(.6deg) translateY(1px)}
  .hand:focus-visible{outline:3px dashed var(--blue);outline-offset:4px}
  .hand:disabled{opacity:.35;cursor:not-allowed;border-style:dashed}
  .hand.primary{border-color:var(--red);color:var(--red)}
  .hand.primary:not(:disabled){box-shadow:3px 3px 0 rgba(216,57,43,.25)}
  .rnd{width:44px;height:44px;padding:0;border-radius:50% 46% 52% 48%/48% 52% 46% 50%;font:700 20px/1 Kalam,cursive}
  .rnd[aria-current="true"]{background:rgba(255,228,90,.85)}
  .rnd .tick{position:absolute;right:-6px;top:-8px;font:700 14px/1 Kalam;color:var(--green)}
  .actions{position:absolute;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .side{position:absolute;width:220px}
  .side .lbl{font:700 16px/1.2 Kalam,cursive;color:#55555f;margin:0}
  .score{position:relative;display:inline-block;font:400 60px/1 "Permanent Marker",cursive;color:var(--red);margin:16px 0 8px 6px;padding:6px 14px 2px 8px}
  .scrow{display:block}
  .score svg{position:absolute;inset:-10px -16px -6px -14px;width:calc(100% + 30px);height:calc(100% + 16px);overflow:visible}
  .score path{fill:none;stroke:var(--red);stroke-width:3;stroke-linecap:round;stroke-dasharray:700;stroke-dashoffset:700;transition:stroke-dashoffset .9s cubic-bezier(.6,.1,.3,1) .1s}
  .score.on path{stroke-dashoffset:0}
  .team{font:700 17px/1.3 Kalam,cursive;color:var(--ink);margin:2px 0 10px}
  .team .bar{display:inline-block;height:10px;background:var(--blue);border-radius:6px 2px 7px 3px;vertical-align:1px;margin-left:6px;opacity:.85}
  .story{font:400 17px/1.35 Kalam,cursive;color:#2c2c34;margin:0;padding-left:12px;border-left:3px solid var(--green)}
  .waiting{font:400 18px/1.35 Kalam,cursive;color:#6a6a74;margin:0}
  .legend{font:700 15px/1.6 Kalam,cursive;color:#3a3a44;margin:14px 0 0;padding:0;list-style:none}
  .legend i{display:inline-block;width:26px;height:5px;border-radius:3px;vertical-align:4px;margin-right:8px}
  .tip{position:absolute;pointer-events:none;background:var(--paper);border:2px solid var(--ink);
    border-radius:12px 3px 14px 4px/4px 14px 3px 12px;padding:6px 10px 4px;font:400 15px/1.3 Kalam,cursive;color:var(--ink);
    box-shadow:2px 3px 0 rgba(32,32,39,.12);white-space:nowrap;transform:rotate(-.6deg)}
  .tip b{font-weight:700}
  .tip .g{color:var(--red)} .tip .a{color:var(--blue)}
  .mute{position:absolute;right:40px;bottom:22px;width:40px;height:40px;padding:0;border-radius:50%;}
  .mute svg{width:24px;height:24px;display:block;margin:auto}
  .final{font:400 17px/1.35 Kalam,cursive;margin:12px 0 0;color:#2c2c34}
  @media (max-width:760px){
    .head{left:16px;top:14px;right:16px}
    h1{font-size:27px}
    .sub{font-size:16px;margin-top:6px}
    .prompt{font-size:15px}
    .rounds{top:auto;right:auto}
    .rounds span{display:none}
    .rnd{width:38px;height:38px;font-size:17px}
    .hand{font-size:15px;padding:8px 12px 6px}
    .side{width:auto}
    .scrow{display:flex;gap:22px;align-items:center}
    .score{font-size:38px;margin:10px 0 4px 6px}
    .story{font-size:14.5px;line-height:1.3}
    .team{font-size:14.5px;margin:0}
    .team .bar{max-width:80px}
    .final{font-size:14.5px;margin-top:6px}
    .mute{right:auto;left:16px;bottom:auto;width:36px;height:36px}
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas id="cv" tabindex="0" role="application" aria-roledescription="drawable line chart" aria-describedby="prompt kbd"></canvas>
  <header class="head ink">
    <h1>Draw the rest of the line</h1>
    <p class="sub"><span id="roundNo">Chart 1 of 3</span> · <b id="series">Weekly active riders</b>, <span id="org">Ostra Bikes, Lisbon</span></p>
    <p class="prompt" id="prompt">You can see January to mid-May. Draw how the summer went.</p>
  </header>
  <nav class="rounds ink" id="rounds" aria-label="Choose a chart"><span>charts</span></nav>
  <div class="actions" id="actions">
    <button class="hand primary ink" id="reveal" type="button" disabled>Show me how it went</button>
    <button class="hand ink" id="erase" type="button">Erase my line</button>
    <button class="hand ink" id="next" type="button" hidden>Next chart →</button>
  </div>
  <aside class="side ink" id="side" aria-live="polite"></aside>
  <div class="tip" id="tip" hidden></div>
  <button class="hand mute ink" id="mute" type="button" aria-pressed="false" aria-label="Marker sound on"></button>
  <p class="sr" id="kbd">Keyboard: Left and Right pick a week in the hidden part, Up and Down set your guess for it, Enter reveals the real line, Backspace erases.</p>
  <p class="sr" id="live" aria-live="polite"></p>
  <div class="sr" id="table"></div>
</main>
<script>
(() => {
'use strict';
const $ = s => document.getElementById(s);
const cv = $('cv'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------------- data ---------------- */
const NWK = 36, KNOWN = 20; // weeks 0..19 visible, 20..35 hidden
const WEEK0 = new Date(2026,0,5);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const weekDate = w => new Date(2026,0,5+7*w);
const wkLabel = w => { const d = weekDate(w); return d.getDate()+' '+MON[d.getMonth()]; };
const monthTicks = [[0,'Jan'],[4,'Feb'],[8,'Mar'],[13,'Apr'],[17,'May'],[21,'Jun'],[26,'Jul'],[30,'Aug'],[35,'Sep']];
function series(base, mul, seed, jitter){ const r = mulberry32(seed); return base.map(v => Math.round(v*mul + (r()-0.5)*jitter)); }
const ROUNDS = [
  { series:'Weekly active riders', org:'Ostra Bikes, Lisbon', unit:'riders', yMax:50000, step:10000,
    tick:v => v ? (v/1000)+'k' : '0',
    vals: series([18.4,18.0,19.1,18.7,19.6,20.2,19.8,20.9,21.5,21.2,22.4,23.1,22.6,24.0,24.8,24.1,25.3,26.0,25.6,26.9,
                  27.4,31.8,35.9,38.6,40.2,41.9,43.5,44.8,46.1,45.2,41.0,37.4,36.1,38.9,42.7,44.6], 1000, 11, 300),
    prompt:'You can see January to mid-May. Draw how the summer went.',
    notes:[{w:21,t:'E-bikes launch, 1 Jun', dy:-1},{w:32,t:'Lisbon leaves for August', dy:1}],
    story:'E-bikes nearly doubled riding in six weeks. Then locals left the city in August and rides fell by a fifth before coming back in September.', team:58 },
  { series:'Support tickets per week', org:'Ledgerly accounting', unit:'tickets', yMax:1000, step:200,
    tick:v => String(v),
    vals: series([612,598,640,655,631,662,648,671,690,664,702,688,715,698,721,734,706,742,751,728,
                  640,502,431,396,384,391,402,868,455,418,409,426,438,447,461,470], 1, 23, 6),
    prompt:'Tickets kept creeping up all spring. Draw the next four months.',
    notes:[{w:20,t:'New help centre, 25 May', dy:-1},{w:27,t:'Payments outage, 14 Jul', dy:-1}],
    story:'The self-serve help centre cut tickets by 45% in a month. One outage week wiped that out, but only for a week.', team:54 },
  { series:'Median checkout time', org:'Pantry grocery app', unit:'seconds', yMax:80, step:20,
    tick:v => v+'s',
    vals: [47.8,47.1,46.5,46.9,45.2,44.8,44.1,43.5,43.9,42.6,41.8,41.2,40.5,40.9,39.6,39.1,38.4,38.0,37.2,36.8,
           36.1,35.4,35.6,35.0,34.8,35.1,58.6,61.2,57.9,41.5,34.2,32.9,32.1,31.6,31.4,30.9],
    prompt:'Checkout got faster every month. Where did it go next?',
    notes:[{w:26,t:'Payments SDK 4.0 ships', dy:-1},{w:29,t:'Rolled back', dy:1}],
    story:'Steady gains, then one SDK update added 25 seconds to every checkout for three weeks until it was rolled back.', team:47 },
];
const fmtVal = (R,v) => R.unit==='seconds' ? v.toFixed(1)+' s' : Math.round(v).toLocaleString('en-GB')+' '+R.unit;

/* ---------------- state ---------------- */
let ri = 0;
let guess = new Array(NWK).fill(null);
let state = 'draw';        // draw | reveal | done
let revealP = 0;
const results = [null,null,null];
let hoverW = -1, kbW = KNOWN;
let drawing = false, lastW = -1, lastV = 0;
let W=0,H=0,DPR=1, G={};

/* ---------------- layout ---------------- */
function layout(){
  const r = cv.getBoundingClientRect(); W = r.width; H = r.height;
  DPR = Math.min(2, devicePixelRatio||1);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  const mob = W < 760;
  if (!mob){
    const wk = Math.max(14, Math.min(24, (W - 150 - 300)/NWK, (H - 330)/20));
    const PW = wk*NWK, PH = wk*20;
    const PX = Math.max(150, (W - PW - 260)/2 + 40), PY = Math.max(176, Math.min(200, H*0.23));
    G = {mob, wk, gs:wk, PX, PY, PW, PH};
  } else {
    const PX = 52, wk = (W - PX - 16)/NWK, gs = wk*2;
    const PH = Math.min(gs*20, H*0.4);
    G = {mob, wk, gs: PH/20, PX, PY: 210, PW: wk*NWK, PH};
  }
  placeDom(); buildBase(); draw();
}
const xOf = w => G.PX + (w+0.5)*G.wk;
const yOf = v => G.PY + G.PH - v/ROUNDS[ri].yMax*G.PH;
const vAt = y => Math.max(0, Math.min(ROUNDS[ri].yMax, (G.PY + G.PH - y)/G.PH*ROUNDS[ri].yMax));

function placeDom(){
  const a = $('actions'), s = $('side'), rn = $('rounds');
  if (!G.mob){
    Object.assign(a.style, {left:G.PX+'px', top:(G.PY+G.PH+50)+'px', right:'auto'});
    Object.assign(s.style, {left:(G.PX+G.PW+40)+'px', top:(G.PY+6)+'px', right:'auto', width:Math.min(240, W - (G.PX+G.PW+40) - 30)+'px'});
    Object.assign(rn.style, {left:'auto', top:'30px', right:'40px'});
  } else {
    const ay = G.PY + G.PH + 40;
    Object.assign(a.style, {left:'16px', top:ay+'px', right:'16px'});
    Object.assign(s.style, {left:'16px', top:(ay+56)+'px', right:'16px', width:'auto'});
    Object.assign(rn.style, {left:'auto', right:'14px', top:(G.PY - 46)+'px'});
    Object.assign($('mute').style, {top:(G.PY - 45)+'px'});
  }
}

/* ---------------- paper + base layer ---------------- */
const base = document.createElement('canvas'), bx = base.getContext('2d');
function wobblePts(x1,y1,x2,y2,amp,seed,n=40){
  const r = mulberry32(seed), pts=[], ph1=r()*6, ph2=r()*6, bow=(r()-0.5)*amp*2.5;
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy), nx=-dy/len, ny=dx/len;
  for (let i=0;i<=n;i++){ const u=i/n; const o = Math.sin(u*7+ph1)*amp*0.5 + Math.sin(u*17+ph2)*amp*0.25 + Math.sin(u*Math.PI)*bow;
    pts.push([x1+dx*u+nx*o, y1+dy*u+ny*o]); }
  return pts;
}
function buildBase(){
  base.width = cv.width; base.height = cv.height;
  const g = bx; g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle = '#fbfaf3'; g.fillRect(0,0,W,H);
  // paper tooth
  const r = mulberry32(7);
  for (let i=0;i<W*H/220;i++){ g.fillStyle = r()<0.5 ? 'rgba(120,110,80,.05)' : 'rgba(255,255,255,.5)'; g.fillRect(r()*W, r()*H, 1, 1); }
  for (let i=0;i<70;i++){ g.strokeStyle='rgba(150,140,110,.06)'; g.lineWidth=0.6; const x=r()*W,y=r()*H; g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+r()*20-10,y+r()*10,x+r()*30-15,y+r()*14-7); g.stroke(); }
  // grid aligned to the plot
  g.strokeStyle = 'rgba(66,135,196,.22)'; g.lineWidth = 1;
  g.beginPath();
  const gs = G.gs;
  for (let x = G.PX % gs; x < W; x += gs){ g.moveTo(Math.round(x)+0.5, 0); g.lineTo(Math.round(x)+0.5, H); }
  for (let y = (G.PY+G.PH) % gs; y < H; y += gs){ g.moveTo(0, Math.round(y)+0.5); g.lineTo(W, Math.round(y)+0.5); }
  g.stroke();
  // red margin + punched holes
  if (!G.mob){
    g.strokeStyle = 'rgba(216,57,43,.45)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(78,0); g.lineTo(78,H); g.stroke();
    for (const fy of [0.18,0.5,0.82]){
      const y = H*fy;
      const hg = g.createRadialGradient(36,y-2,2,36,y,13); hg.addColorStop(0,'#cfc9b8'); hg.addColorStop(0.75,'#e7e2d2'); hg.addColorStop(1,'rgba(160,150,120,.55)');
      g.fillStyle = hg; g.beginPath(); g.arc(36,y,12,0,Math.PI*2); g.fill();
      g.strokeStyle='rgba(120,110,80,.35)'; g.lineWidth=1; g.stroke();
    }
  }
  const R = ROUNDS[ri];
  // axes in black marker
  markerStroke(g, wobblePts(G.PX-4, G.PY+G.PH, G.PX+G.PW+14, G.PY+G.PH, 0.9, 3+ri), '#202027', 3.2, 31);
  markerStroke(g, wobblePts(G.PX, G.PY+G.PH+4, G.PX, G.PY-14, 0.9, 5+ri), '#202027', 3.2, 37);
  arrowHead(g, G.PX+G.PW+14, G.PY+G.PH, 0, '#202027');
  arrowHead(g, G.PX, G.PY-14, -Math.PI/2, '#202027');
  // y ticks
  g.save(); g.globalCompositeOperation='multiply';
  g.fillStyle = '#26262d'; g.font = `700 ${G.mob?13:16}px Kalam, cursive`; g.textAlign='right'; g.textBaseline='middle';
  for (let v=0; v<=R.yMax; v+=R.step){
    const y = yOf(v);
    g.fillText(R.tick(v), G.PX - 10, y + 1);
    markerStroke(g, [[G.PX-5,y],[G.PX+5,y+0.4]], '#202027', 2.2, v);
  }
  g.textAlign='center'; g.textBaseline='top';
  for (const [w,m] of monthTicks){
    const x = G.PX + w*G.wk + G.wk*0.5;
    if (G.mob && (w===4||w===13||w===26)) continue;
    g.fillText(m, x, G.PY+G.PH+10);
    markerStroke(g, [[x, G.PY+G.PH-4],[x+0.3, G.PY+G.PH+5]], '#202027', 2, w+9);
  }
  // unit label
  g.textAlign='left'; g.textBaseline='alphabetic'; g.font = `700 ${G.mob?13:15}px Kalam, cursive`; g.fillStyle='#4a4a55';
  g.fillText(R.unit + (R.unit==='seconds'?'':' per week'), G.PX + 10, G.PY - 6);
  g.restore();
  // hidden zone
  const x0 = xOf(KNOWN-1);
  g.save(); g.globalCompositeOperation='multiply';
  g.setLineDash([7,7]); g.strokeStyle='rgba(32,32,39,.55)'; g.lineWidth=1.6;
  g.beginPath(); g.moveTo(x0, G.PY-6); g.lineTo(x0+0.6, G.PY+G.PH); g.stroke(); g.setLineDash([]);
  g.fillStyle='rgba(66,135,196,.06)'; g.fillRect(x0, G.PY-6, G.PX+G.PW - x0 + 6, G.PH+6);
  g.restore();
  // known line in blue marker
  const kp = smooth(R.vals.slice(0,KNOWN).map((v,w)=>[xOf(w), yOf(v)]), 101+ri);
  markerStroke(g, kp, '#1d5fc4', G.mob?3.6:4.6, 77+ri, true);
}
function arrowHead(g,x,y,ang,col){
  const s = 10;
  const pts1 = [[x - s*Math.cos(ang - 0.45), y - s*Math.sin(ang - 0.45)], [x,y]];
  const pts2 = [[x - s*Math.cos(ang + 0.45), y - s*Math.sin(ang + 0.45)], [x,y]];
  markerStroke(g, pts1, col, 3, 3); markerStroke(g, pts2, col, 3, 4);
}

/* ---------------- felt-tip marker rendering ---------------- */
function smooth(pts, seed){
  if (pts.length < 2) return pts.slice();
  const out = [], r = mulberry32(seed||1), ph = r()*10;
  for (let i=0;i<pts.length-1;i++){
    const p0 = pts[Math.max(0,i-1)], p1 = pts[i], p2 = pts[i+1], p3 = pts[Math.min(pts.length-1,i+2)];
    const n = 8;
    for (let k=0;k<n;k++){
      const t = k/n, t2=t*t, t3=t2*t;
      const x = 0.5*((2*p1[0]) + (-p0[0]+p2[0])*t + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3);
      const y = 0.5*((2*p1[1]) + (-p0[1]+p2[1])*t + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3);
      const s = (i+t);
      out.push([x, y + Math.sin(s*1.7+ph)*0.45 + Math.sin(s*4.3+ph*2)*0.25]);
    }
  }
  out.push(pts[pts.length-1]);
  return out;
}
function offset(pts, d){
  const p = new Path2D();
  for (let i=0;i<pts.length;i++){
    const a = pts[Math.max(0,i-1)], b = pts[Math.min(pts.length-1,i+1)];
    let nx = -(b[1]-a[1]), ny = b[0]-a[0]; const l = Math.hypot(nx,ny)||1; nx/=l; ny/=l;
    const x = pts[i][0]+nx*d, y = pts[i][1]+ny*d;
    i ? p.lineTo(x,y) : p.moveTo(x,y);
  }
  return p;
}
function markerStroke(g, pts, col, w, seed, blobs){
  if (pts.length < 2) return;
  const path = new Path2D(); pts.forEach(([x,y],i)=> i ? path.lineTo(x,y) : path.moveTo(x,y));
  g.save(); g.lineCap='round'; g.lineJoin='round';
  g.globalCompositeOperation='multiply';
  g.strokeStyle = col;
  g.globalAlpha = 0.13; g.lineWidth = w + 2.4; g.stroke(path);            // capillary bleed into paper
  g.globalAlpha = 0.82; g.lineWidth = w; g.stroke(path);                  // body
  g.globalAlpha = 0.28; g.lineWidth = Math.max(0.8, w*0.22);              // ink pooled at the edges
  g.stroke(offset(pts, w*0.4)); g.stroke(offset(pts, -w*0.4));
  g.globalCompositeOperation='source-over';
  g.globalAlpha = 0.2; g.strokeStyle = '#fffef6'; g.lineWidth = 0.7;       // dry streaks from the nib
  g.stroke(offset(pts, w*0.12)); g.globalAlpha=0.12; g.stroke(offset(pts, -w*0.2));
  if (blobs){
    g.globalCompositeOperation='multiply';
    for (const [x,y] of [pts[0], pts[pts.length-1]]){
      const rg = g.createRadialGradient(x,y,0,x,y,w*0.75); rg.addColorStop(0,col); rg.addColorStop(1,'rgba(255,255,255,0)');
      g.globalAlpha = 0.6; g.fillStyle = rg; g.beginPath(); g.arc(x,y,w*0.75,0,Math.PI*2); g.fill();
    }
  }
  g.restore();
}
function highlighter(g, poly, seed){
  if (poly.length < 3) return;
  g.save();
  const clip = new Path2D(); poly.forEach(([x,y],i)=> i ? clip.lineTo(x,y) : clip.moveTo(x,y)); clip.closePath();
  g.clip(clip);
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9; for (const [x,y] of poly){ minX=Math.min(minX,x); maxX=Math.max(maxX,x); minY=Math.min(minY,y); maxY=Math.max(maxY,y); }
  g.globalCompositeOperation='multiply'; g.lineCap='round'; g.strokeStyle='#ffe14d'; g.lineWidth = 15;
  const r = mulberry32(seed);
  for (let x = minX - 20; x < maxX + 20; x += 10){
    g.globalAlpha = 0.42 + r()*0.12;
    g.beginPath(); g.moveTo(x + r()*3, minY - 8); g.lineTo(x + 14 + r()*4, maxY + 8); g.stroke();
  }
  g.restore();
}

/* ---------------- drawing ---------------- */
function guessPts(){
  const R = ROUNDS[ri];
  const pts = [[xOf(KNOWN-1), yOf(R.vals[KNOWN-1])]];
  for (let w=KNOWN; w<NWK && guess[w]!=null; w++) pts.push([xOf(w), yOf(guess[w])]);
  return pts;
}
const complete = () => guess.slice(KNOWN).every(v => v!=null);
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(base,0,0);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const R = ROUNDS[ri];
  const gp = guessPts();
  // reveal: highlighter between lines, then the real line
  if (state !== 'draw'){
    const upto = KNOWN-1 + revealP*(NWK-KNOWN);
    const top = [], bot = [];
    for (let w=KNOWN-1; w<=Math.floor(upto); w++){ const gv = w<KNOWN ? R.vals[w] : guess[w]; top.push([xOf(w), yOf(R.vals[w])]); bot.push([xOf(w), yOf(gv)]); }
    const fw = upto - Math.floor(upto);
    if (fw > 0.01 && Math.floor(upto) < NWK-1){
      const w = Math.floor(upto), a = R.vals[w] + (R.vals[w+1]-R.vals[w])*fw, gv = (w<KNOWN?R.vals[w]:guess[w]) + (guess[w+1]-(w<KNOWN?R.vals[w]:guess[w]))*fw;
      top.push([xOf(w+fw), yOf(a)]); bot.push([xOf(w+fw), yOf(gv)]);
    }
    highlighter(ctx, top.concat(bot.reverse()), 5+ri);
  }
  if (gp.length > 1) markerStroke(ctx, smooth(gp, 202+ri), '#d8392b', G.mob?3.6:4.6, 91, !drawing);
  if (state !== 'draw'){
    const upto = KNOWN-1 + revealP*(NWK-KNOWN);
    const pts = [];
    for (let w=KNOWN-1; w<=Math.floor(upto); w++) pts.push([xOf(w), yOf(R.vals[w])]);
    const fw = upto - Math.floor(upto);
    if (fw > 0.01 && Math.floor(upto) < NWK-1){ const w=Math.floor(upto); pts.push([xOf(w+fw), yOf(R.vals[w] + (R.vals[w+1]-R.vals[w])*fw)]); }
    markerStroke(ctx, smooth(pts, 301+ri), '#1d5fc4', G.mob?3.6:4.6, 55, revealP>=1);
    if (revealP >= 1) annotate(R);
  } else if (gp.length === 1 && !drawing){
    // invitation: dotted "start here" ring + arrow
    const [x,y] = gp[0];
    ctx.save(); ctx.globalCompositeOperation='multiply';
    const t = performance.now()/600;
    ctx.strokeStyle='#d8392b'; ctx.lineWidth=2.2; ctx.setLineDash([3,5]); ctx.lineDashOffset = -t*6;
    ctx.beginPath(); ctx.arc(x,y,13 + Math.sin(t)*1.5,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
    const ax = Math.min(x + 90, G.PX + G.PW - 40), ay = y - (G.mob? 50 : 70);
    const arrow = []; for (let i=0;i<=20;i++){ const u=i/20; arrow.push([ax + (x+18-ax)*u, ay + (y-14-ay)*u - Math.sin(u*Math.PI)*22]); }
    markerStroke(ctx, arrow, '#d8392b', 2.6, 12);
    const last = arrow[arrow.length-1], prev = arrow[arrow.length-3];
    arrowHead(ctx, last[0], last[1], Math.atan2(last[1]-prev[1], last[0]-prev[0]), '#d8392b');
    ctx.save(); ctx.globalCompositeOperation='multiply'; ctx.fillStyle='#d8392b'; ctx.font=`700 ${G.mob?15:19}px Kalam, cursive`; ctx.textAlign='left';
    ctx.fillText('start your line here', Math.min(ax + 6, G.PX+G.PW-150), ay - 6); ctx.restore();
  }
  // hover guide
  const hw = hoverW >= 0 ? hoverW : -1;
  if (hw >= 0){
    const x = xOf(hw);
    ctx.save(); ctx.globalCompositeOperation='multiply';
    ctx.strokeStyle='rgba(60,60,70,.55)'; ctx.lineWidth=1.2; ctx.setLineDash([2,4]);
    ctx.beginPath(); ctx.moveTo(x, G.PY-4); ctx.lineTo(x, G.PY+G.PH); ctx.stroke(); ctx.setLineDash([]);
    const dots = [];
    if (hw < KNOWN || state==='done') dots.push([R.vals[hw], '#1d5fc4']);
    if (hw >= KNOWN && guess[hw]!=null) dots.push([guess[hw], '#d8392b']);
    for (const [v,c] of dots){ ctx.fillStyle=c; ctx.globalAlpha=.9; ctx.beginPath(); ctx.arc(x, yOf(v), G.mob?4:5.5, 0, Math.PI*2); ctx.fill(); }
    ctx.restore();
  }
}
function annotate(R){
  R.notes.forEach((n, idx) => {
    const x = xOf(n.w), y = yOf(R.vals[n.w]);
    const up = G.mob ? false : n.dy < 0;
    const lowest = Math.max(...R.vals.slice(KNOWN).map(yOf), ...guess.slice(KNOWN).map(yOf));
    let lx = x + (G.mob ? -10 : -30), ly = up ? Math.max(G.PY + 14, y - 70)
      : G.mob ? Math.min(G.PY+G.PH-14, Math.max(y + 46, lowest + 26) + idx*30) : Math.min(G.PY+G.PH-10, y + 74);
    ctx.save(); ctx.globalCompositeOperation='multiply'; ctx.fillStyle='#202027';
    ctx.font = `700 ${G.mob?12.5:16}px Kalam, cursive`; ctx.textAlign = 'center';
    const tw = ctx.measureText(n.t).width;
    lx = Math.max(G.PX + tw/2 + 4, Math.min(G.PX + G.PW - tw/2, lx));
    ctx.fillText(n.t, lx, ly + (up ? -4 : 14));
    ctx.restore();
    const sx = lx, sy = up ? ly + 2 : ly - 2, ex = x, ey = y + (up ? -10 : 10);
    const pts = []; for (let i=0;i<=16;i++){ const u=i/16; pts.push([sx+(ex-sx)*u + Math.sin(u*Math.PI)*14, sy+(ey-sy)*u]); }
    markerStroke(ctx, pts, '#202027', 2, n.w);
    const a = pts[pts.length-1], b = pts[pts.length-3];
    arrowHead(ctx, a[0], a[1], Math.atan2(a[1]-b[1], a[0]-b[0]), '#202027');
  });
}

/* ---------------- side panel + rounds ---------------- */
function scoreOf(){
  const R = ROUNDS[ri]; let err = 0;
  for (let w=KNOWN; w<NWK; w++) err += Math.abs(guess[w] - R.vals[w]);
  const mae = err/(NWK-KNOWN);
  return Math.max(0, Math.round(100*(1 - mae/(0.3*R.yMax))));
}
function renderSide(){
  const R = ROUNDS[ri], s = $('side');
  const legend = `<ul class="legend"><li><i style="background:#1d5fc4"></i>what happened</li><li><i style="background:#d8392b"></i>your guess</li>${state==='done'?'<li><i style="background:#ffe14d"></i>how far off you were</li>':''}</ul>`;
  if (state !== 'done'){
    const filled = guess.slice(KNOWN).filter(v=>v!=null).length;
    s.innerHTML = `<p class="waiting">${filled===0 ? 'Your line goes in the shaded part. Draw it in one go, or redo any bit.' : filled < NWK-KNOWN ? `Keep going: ${NWK-KNOWN-filled} more weeks to draw.` : 'Happy with it? Press <b>Show me how it went</b>.'}</p>${legend}`;
    return;
  }
  const sc = results[ri];
  const done = results.filter(x=>x!=null);
  const avg = Math.round(done.reduce((a,b)=>a+b,0)/done.length);
  s.innerHTML = `<div class="scrow"><div><p class="lbl">your line was</p>
    <div class="score" id="score"><span id="scoreN">0</span>%<svg viewBox="0 0 100 60" preserveAspectRatio="none" aria-hidden="true"><path d="M58 4 C 20 0, 2 14, 4 32 C 6 52, 40 60, 70 54 C 96 48, 100 22, 84 10 C 74 3, 52 2, 40 6"/></svg></div>
    <p class="lbl" style="margin-top:-2px">accurate</p></div>
    <p class="team">Team average ${R.team}%<span class="bar" style="width:${R.team*0.9}px"></span><br>You ${sc}%<span class="bar" style="width:${sc*0.9}px;background:#d8392b"></span></p></div>
    <p class="story">${R.story}</p>
    ${done.length===3 ? `<p class="final">All three charts drawn. Your calibration: <b>${avg}%</b> — ${avg>=70?'sharper than the team':avg>=55?'right in line with the team':'the surprises got you, as they did most of us'}.</p>` : ''}`;
  const n = $('scoreN'), sEl = $('score');
  requestAnimationFrame(() => sEl.classList.add('on'));
  if (reduce){ n.textContent = sc; return; }
  const t0 = performance.now();
  (function count(){ const u = Math.min(1, (performance.now()-t0)/900); n.textContent = Math.round(sc*(1-Math.pow(1-u,3))); if (u<1) requestAnimationFrame(count); })();
}
function renderRounds(){
  const nav = $('rounds');
  nav.querySelectorAll('button').forEach(b=>b.remove());
  ROUNDS.forEach((R,k) => {
    const b = document.createElement('button');
    b.className = 'hand rnd'; b.type='button';
    b.innerHTML = (k+1) + (results[k]!=null ? '<span class="tick" aria-hidden="true">✓</span>' : '');
    b.setAttribute('aria-label', `Chart ${k+1}: ${R.series}${results[k]!=null?', scored '+results[k]+'%':''}`);
    if (k===ri) b.setAttribute('aria-current','true');
    b.addEventListener('click', () => setRound(k));
    nav.appendChild(b);
  });
}
function renderTable(){
  const R = ROUNDS[ri];
  const rows = R.vals.map((v,w) => `<tr><th>Week of ${wkLabel(w)}</th><td>${w<KNOWN||state==='done' ? fmtVal(R,v) : 'hidden until you guess'}</td><td>${guess[w]!=null?'your guess '+fmtVal(R,guess[w]):''}</td></tr>`).join('');
  $('table').innerHTML = `<table><caption>${R.series}, ${R.org}, 2026</caption>${rows}</table>`;
}
function syncUi(){
  const R = ROUNDS[ri];
  $('roundNo').textContent = `Chart ${ri+1} of 3`;
  $('series').textContent = R.series; $('org').textContent = R.org; $('prompt').textContent = R.prompt;
  $('reveal').disabled = !(state==='draw' && complete());
  $('reveal').hidden = state==='done';
  $('erase').hidden = state!=='draw';
  $('next').hidden = state!=='done';
  $('next').textContent = results.every(x=>x!=null) ? 'Start over' : 'Next chart →';
  cv.setAttribute('aria-label', `${R.series}, ${R.org}, weekly from 5 January 2026. Known up to week of ${wkLabel(KNOWN-1)}: ${fmtVal(R, R.vals[KNOWN-1])}. ${state==='done'?'Revealed.':'Draw or set your guess for the remaining 16 weeks.'}`);
  renderSide(); renderRounds(); renderTable();
}
function setRound(k){
  ri = k; guess = new Array(NWK).fill(null); state = 'draw'; revealP = 0; hoverW = -1; kbW = KNOWN;
  if (results[k]!=null){ // re-entering a scored round: start fresh
    results[k] = null;
  }
  $('tip').hidden = true;
  buildBase(); syncUi(); draw();
}

/* ---------------- marker squeak (WebAudio) ---------------- */
let AC=null, sq=null, muted=false;
function audio(){
  if (AC){ if (AC.state==='suspended') AC.resume(); return; }
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    const len = AC.sampleRate*2, buf = AC.createBuffer(1,len,AC.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2400; bp.Q.value=9;
    const bp2 = AC.createBiquadFilter(); bp2.type='peaking'; bp2.frequency.value=5200; bp2.gain.value=6;
    const g = AC.createGain(); g.gain.value = 0;
    const m = AC.createGain(); m.gain.value = 0.18;
    src.connect(bp); bp.connect(bp2); bp2.connect(g); g.connect(m); m.connect(AC.destination); src.start();
    sq = {bp, g};
  }catch(e){ AC = null; }
}
function squeak(speed){
  if (!AC || !sq) return;
  const t = AC.currentTime, v = muted ? 0 : Math.min(0.55, speed*0.012);
  sq.g.gain.setTargetAtTime(v, t, 0.02);
  sq.bp.frequency.setTargetAtTime(1800 + Math.min(2600, speed*28) + Math.random()*200, t, 0.03);
}
function hush(){ if (AC && sq) sq.g.gain.setTargetAtTime(0, AC.currentTime, 0.04); }
function setMuteIcon(){
  $('mute').innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h4l5-4.5v14l-5-4.5H4z" fill="none" stroke="#202027" stroke-width="2" stroke-linejoin="round"/>${muted ? '<path d="M16 9l5 6M21 9l-5 6" stroke="#d8392b" stroke-width="2.2" stroke-linecap="round"/>' : '<path d="M16.5 9c1.4 1.6 1.4 4.4 0 6M19 6.5c2.8 3 2.8 8 0 11" fill="none" stroke="#202027" stroke-width="2" stroke-linecap="round"/>'}</svg>`;
  $('mute').setAttribute('aria-pressed', String(muted));
  $('mute').setAttribute('aria-label', muted ? 'Marker sound off' : 'Marker sound on');
}
$('mute').addEventListener('click', () => { muted = !muted; setMuteIcon(); if (muted) hush(); });

/* ---------------- pointer drawing ---------------- */
function inPlot(x,y){ return x >= G.PX - 10 && x <= G.PX + G.PW + 16 && y >= G.PY - 30 && y <= G.PY + G.PH + 20; }
function weekAt(x){ return Math.max(0, Math.min(NWK-1, Math.round((x - G.PX)/G.wk - 0.5))); }
function firstOpen(){ for (let w=KNOWN; w<NWK; w++) if (guess[w]==null) return w; return NWK; }
function setGuessTo(w, v){
  // connect from the end of the contiguous line so it never has gaps
  const fo = firstOpen();
  let fromW = Math.min(lastW>=KNOWN ? lastW : KNOWN-1, fo-1);
  if (drawing && lastW >= KNOWN-1) fromW = lastW;
  const fromV = fromW < KNOWN ? ROUNDS[ri].vals[KNOWN-1] : (fromW===lastW && drawing ? lastV : guess[fromW]);
  const a = Math.min(fromW, w), b = Math.max(fromW, w);
  for (let k = Math.max(KNOWN, a); k <= b; k++){
    const u = b===a ? 1 : (k - fromW)/(w - fromW);
    guess[k] = fromV + (v - fromV)*Math.max(0,Math.min(1,u));
  }
  lastW = w; lastV = v;
}
let lastPt = null;
cv.addEventListener('pointerdown', e => {
  audio();
  if (state!=='draw') return;
  if (!inPlot(e.clientX, e.clientY)) return;
  const w = weekAt(e.clientX);
  if (w < KNOWN - 1) return;
  e.preventDefault();
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  drawing = true; lastPt = {x:e.clientX, y:e.clientY, t:performance.now()};
  if (w >= KNOWN){
    const fo = firstOpen();
    if (w > fo){ lastW = fo - 1; lastV = fo-1 < KNOWN ? ROUNDS[ri].vals[KNOWN-1] : guess[fo-1]; }
    else { lastW = w; lastV = vAt(e.clientY); }
    setGuessTo(w, vAt(e.clientY));
  } else { lastW = KNOWN-1; lastV = ROUNDS[ri].vals[KNOWN-1]; }
  $('tip').hidden = true;
  syncUi(); draw();
});
cv.addEventListener('pointermove', e => {
  const x = e.clientX, y = e.clientY;
  if (drawing){
    const w = weekAt(x);
    if (w >= KNOWN) setGuessTo(w, vAt(y));
    const now = performance.now(), d = Math.hypot(x-lastPt.x, y-lastPt.y), dt = Math.max(8, now-lastPt.t);
    squeak(d/dt*16); lastPt = {x,y,t:now};
    hoverW = -1; draw(); renderSide(); $('reveal').disabled = !complete();
    return;
  }
  if (inPlot(x,y)){ const w = weekAt(x); if (w !== hoverW){ hoverW = w; showTip(w); draw(); } }
  else if (hoverW >= 0){ hoverW = -1; $('tip').hidden = true; draw(); }
});
const endDraw = () => {
  if (!drawing) return;
  drawing = false; hush(); lastW = -1;
  draw(); syncUi();
  if (complete()) announce('Your guess is complete. Press Show me how it went.');
};
cv.addEventListener('pointerup', endDraw);
cv.addEventListener('pointercancel', endDraw);
cv.addEventListener('pointerleave', () => { if (!drawing && hoverW>=0){ hoverW=-1; $('tip').hidden = true; draw(); } });

function showTip(w){
  const R = ROUNDS[ri], tip = $('tip');
  if (w < 0){ tip.hidden = true; return; }
  let html = `<b>Week of ${wkLabel(w)}</b><br>`;
  if (w < KNOWN || state==='done') html += `<span class="a">${fmtVal(R, R.vals[w])}</span>`;
  else html += `<span style="color:#77777f">real number hidden</span>`;
  if (w >= KNOWN && guess[w]!=null) html += `<br><span class="g">you guessed ${fmtVal(R, guess[w])}</span>`;
  tip.innerHTML = html; tip.hidden = false;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = xOf(w) + 12, y = G.PY - th - 4 + (G.mob ? 26 : 0);
  if (x + tw > W - 8) x = xOf(w) - tw - 12;
  tip.style.left = Math.max(6,x) + 'px'; tip.style.top = Math.max(4, y) + 'px';
}

/* ---------------- reveal ---------------- */
function reveal(){
  if (!complete() || state!=='draw') return;
  audio();
  state = 'reveal'; revealP = 0; hoverW = -1; $('tip').hidden = true;
  syncUi();
  if (reduce){ revealP = 1; finish(); return; }
  const t0 = performance.now(), dur = 1900;
  (function step(){
    const u = Math.min(1, (performance.now()-t0)/dur);
    const prev = revealP;
    revealP = u<0.5 ? 2*u*u : 1 - Math.pow(-2*u+2,2)/2;
    squeak((revealP-prev)*900);
    draw();
    if (u < 1) requestAnimationFrame(step); else { hush(); finish(); }
  })();
}
function finish(){
  state = 'done'; results[ri] = scoreOf();
  draw(); syncUi();
  announce(`Revealed. Your line was ${results[ri]}% accurate; team average ${ROUNDS[ri].team}%. ${ROUNDS[ri].story}`);
  $('next').focus({preventScroll:true});
}
$('reveal').addEventListener('click', reveal);
$('erase').addEventListener('click', () => { guess = new Array(NWK).fill(null); kbW = KNOWN; syncUi(); draw(); announce('Erased. Draw again.'); });
$('next').addEventListener('click', () => {
  if (results.every(x=>x!=null)){ results.fill(null); setRound(0); }
  else { let k = (ri+1)%3; while (results[k]!=null) k=(k+1)%3; setRound(k); }
  cv.focus({preventScroll:true});
});
function announce(s){ $('live').textContent = s; }

/* ---------------- keyboard ---------------- */
cv.addEventListener('keydown', e => {
  const R = ROUNDS[ri];
  if (e.key==='Enter'){ if (state==='draw' && complete()){ e.preventDefault(); reveal(); } return; }
  if (state!=='draw'){
    if (e.key==='ArrowLeft'||e.key==='ArrowRight'){ e.preventDefault(); hoverW = Math.max(0, Math.min(NWK-1, (hoverW<0?KNOWN:hoverW) + (e.key==='ArrowLeft'?-1:1))); showTip(hoverW); draw(); announce(`Week of ${wkLabel(hoverW)}: ${fmtVal(R,R.vals[hoverW])}${guess[hoverW]!=null?', you guessed '+fmtVal(R,guess[hoverW]):''}`); }
    return;
  }
  if (e.key==='Backspace'||e.key==='Delete'){ e.preventDefault(); $('erase').click(); return; }
  if (!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','PageUp','PageDown'].includes(e.key)) return;
  e.preventDefault(); audio();
  if (guess.slice(KNOWN).every(v=>v==null)) for (let w=KNOWN; w<NWK; w++) guess[w] = R.vals[KNOWN-1]; // start flat
  if (e.key==='ArrowLeft') kbW = Math.max(KNOWN, kbW-1);
  if (e.key==='ArrowRight') kbW = Math.min(NWK-1, kbW+1);
  const stepV = R.yMax/40;
  if (e.key==='ArrowUp'||e.key==='PageUp'){ const dv = e.key==='PageUp'?stepV*4:stepV; for (let w=kbW; w<NWK; w++) guess[w] = Math.min(R.yMax, guess[w] + dv*(e.shiftKey && w>kbW ? 0 : 1)); }
  if (e.key==='ArrowDown'||e.key==='PageDown'){ const dv = e.key==='PageDown'?stepV*4:stepV; for (let w=kbW; w<NWK; w++) guess[w] = Math.max(0, guess[w] - dv*(e.shiftKey && w>kbW ? 0 : 1)); }
  hoverW = kbW; showTip(kbW); draw(); syncUi(); cv.focus({preventScroll:true});
  announce(`Week of ${wkLabel(kbW)}: your guess ${fmtVal(R, guess[kbW])}`);
});
cv.addEventListener('focus', () => { if (state==='draw'){ hoverW = kbW; showTip(kbW); draw(); } });
cv.addEventListener('blur', () => { hoverW = -1; $('tip').hidden = true; draw(); });

/* gentle pulse on the start ring */
(function idle(){
  if (!document.hidden && state==='draw' && !drawing && guess[KNOWN]==null && !reduce) draw();
  setTimeout(() => requestAnimationFrame(idle), 60);
})();

addEventListener('resize', layout);
setMuteIcon();
syncUi();
layout();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { buildBase(); draw(); });
})();
</script>
</body>
</html>
