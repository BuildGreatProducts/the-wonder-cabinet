  .tag small{display:block;font-size:11px;font-style:italic;color:rgba(246,213,143,.65);margin-top:4px;letter-spacing:.03em}

  .hint{position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(100dvh - var(--cardTop) + 8px);color:var(--light);font-style:italic;font-size:14px;pointer-events:none;opacity:.0;white-space:nowrap}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

    .latin{font-size:15px}
    .body{font-size:15.5px;line-height:1.38;margin-top:8px}
    dl.facts{gap:4px 16px;margin-top:10px;padding-top:8px}
    dd{font-size:15px}
    .ways{margin-top:12px}
    .board{font-size:15px;padding:6px 26px 7px 13px}

</style>

/* ---------------- field-guide data ---------------- */
const N = (label, title, o) => Object.assign({label, title}, o || {});
const english = N('English oak','English oak',{latin:'Quercus robur',body:'Acorns hang on long stalks while the leaves sit almost stalkless, with two small ear-shaped lobes at the base. Prefers the heavier soils down by Dowles Brook.',facts:[['Height','20 – 40 m'],['Lifespan','up to 1,000 yrs'],['Flowers','Apr – May']]});

let AC = null, master = null, muted = false, noiseBuf = null;
function audio(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.16; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.05, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3); } catch (e) { AC = null; } }

}
function chirp(base, n, delay){
  if (!AC || muted) return;

    const o = AC.createOscillator(), g = AC.createGain(), f = base * (0.92 + Math.random() * 0.2);

    o.connect(g).connect(master); o.start(t); o.stop(t + 0.12); t += 0.11 + Math.random() * 0.05;
  }
}

  if (!AC || muted) return;

  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = 2600 + Math.random() * 1400; f.Q.value = 3; g.gain.value = 0.55;
  s.connect(f).connect(g).connect(master); s.start();
}
function dropSound(){
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = 'triangle'; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(260, t + 0.08);

  // walker
  const d = walker.tx - walker.x, spd = (mobile ? 150 : 230);
  if (Math.abs(d) > 0.5) { const step = Math.sign(d) * Math.min(Math.abs(d), spd * dt); walker.x += step; walker.face = Math.sign(d); walker.phase += Math.abs(step) * 0.16; walker.moving = true; }
  else { walker.moving = false; walker.face = 1; }
  for (const c of crumbs) {
    if (!c.dropped && walker.face > 0 && walker.x >= c.x - 4) { c.dropped = true; c.dropT = 0; dropSound(); }
    if (c.dropped && c.dropT < 1) c.dropT = Math.min(1, c.dropT + dt / 0.55);
  }
  for (const b of birds.slice()) updateBird(b, dt);
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life -= dt; p.vy += 520 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.y > p.gy) { p.y = p.gy; p.vy *= -0.3; p.vx *= 0.6; } if (p.life <= 0) parts.splice(i, 1); }
  // draw
  const g = cx; g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H);
  for (const c of eaten) drawCrumb(g, c);
  for (const c of crumbs) drawCrumb(g, c);
  g.fillStyle = INK; for (const p of parts) { g.globalAlpha = Math.min(1, p.life * 3); g.fillRect(p.x - 1.2, p.y - 1.2, 2.4, 2.2); } g.globalAlpha = 1;
  drawGretel(g);
  for (const b of birds) drawBird(g, b);
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { running = !document.hidden; if (running) { lastT = 0; requestAnimationFrame(frame); } });
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 60); });

/* ---------------- boot ---------------- */
crumbs = [makeCrumb(0, root, true)];
layout();
const startBirds = mobile ? 4 : 6;
for (let i = 0; i < startBirds; i++) { const p = perches[Math.floor((i + 0.5) / startBirds * perches.length)]; if (p && !p.taken) makeBird(KINDS[i % KINDS.length], p); }
renderTags(-1); renderCard(0);
setTimeout(() => { $('#hint').style.transition = 'opacity 1.2s'; if (hintShown) $('#hint').style.opacity = 0.85; }, 700);
requestAnimationFrame(frame);

// test hooks for automated screenshots
window.__trail = { go: path => { let n = trail[trail.length - 1]; for (const i of path) { n = n.kids[i]; go(n); } }, back };
})();
</script>
