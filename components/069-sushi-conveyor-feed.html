<style>
  :root{--cream:#f4ead2;--red:#d8382a;--mustard:#e9b326;--teal:#2f8f83;--navy:#1d2c5a;--ink:#1a1a1a;--wood:#c98f52}
  *{box-sizing:border-box}

  body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;height:100dvh;overflow:hidden;
    background:repeating-conic-gradient(from 0deg at 18% 4%, rgba(233,179,38,.20) 0 6deg, transparent 6deg 12deg), var(--cream)}
  .dots{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle, rgba(216,56,42,.12) 1.2px, transparent 1.6px) 0 0/9px 9px;mask:linear-gradient(transparent 55%, #000)}

  .card .x{position:absolute;right:8px;top:6px;background:none;border:0;box-shadow:none;color:var(--ink);font-size:18px;padding:0 4px}
  .stripe{position:absolute;left:-3px;right:-3px;top:-3px;height:10px;border-radius:14px 14px 0 0;background:repeating-linear-gradient(90deg,var(--red) 0 12px,var(--cream) 12px 24px);border-bottom:2px solid var(--ink)}

  .island .jp{font-family:"Dela Gothic One";font-size:46px;color:var(--red);line-height:1;text-shadow:3px 3px 0 var(--ink);-webkit-text-stroke:1.5px var(--ink)}

  .island .hint{font-weight:700;font-size:14px;margin-top:10px;color:#3a3a3a;max-width:20em}
  .toast{position:absolute;left:50%;bottom:16px;z-index:9;transform:translate(-50%,180%);font-weight:900;font-size:15px;background:var(--navy);color:var(--cream);padding:9px 18px;border-radius:20px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .35s cubic-bezier(.3,1.5,.5,1);white-space:nowrap}

  @media (max-width:820px){

    header.sign .en{font-size:9.5px}.header.sign .en b{font-size:13px}
    header.sign .en b{font-size:13px}

    .wood{min-height:0;margin-top:6px;padding:6px 4px 8px}
    .stack i{width:30px;height:9px;margin-top:-4px}

    .total{margin-top:4px;font-size:12px}.total b{font-size:18px}

    .speed{flex-direction:column;width:96px;padding:8px 6px;gap:6px}

    .legendm{display:flex}
  }
</style>

<body>
<div id="stage">
  <div class="dots" aria-hidden="true"></div>
  <canvas id="belt" tabindex="0" aria-label="Sushi belt. Use left and right arrows to move between plates, Enter to read about a plate, T to take it." aria-describedby="hl"></canvas>
  <header class="sign enamel"><span class="jp">まわる亭</span><span class="en">KAITEN SUSHI<b>Table 12</b></span></header>
  <div class="island" id="island" aria-hidden="true"><div class="jp">回転寿司</div><div class="en">FRESH FROM THE KITCHEN · ALL DAY</div><div class="hint" id="hint">Drag a plate onto your tray — or tap one to read about it</div></div>
  <div class="card" id="card" role="dialog" aria-modal="false" aria-labelledby="cardEn"></div>
  <aside>
    <section class="legend enamel" aria-label="Price by plate colour"><h2>お皿の色でお値段 <small>PRICE BY PLATE</small></h2><div class="tiers" id="tiers"></div></section>
    <section class="tray enamel" aria-label="Your tray"><div class="trayhead"><h2>おぼん · Your tray <small id="plates">0 PLATES</small></h2></div>
      <div class="wood" id="wood"><span class="empty" id="empty">Drop plates here</span></div>
      <div class="total"><span>Total</span><b id="total">¥0</b></div>
      <button class="billbtn" type="button" id="bill" disabled>お会計 · Ask for the bill</button></section>
    <section class="speed enamel" aria-label="Belt speed"><div class="knob" aria-hidden="true"><div class="ptr" id="ptr"></div></div><h2>速さ<small>BELT SPEED</small></h2>
      <div class="opts" role="radiogroup" aria-label="Belt speed"><label><input type="radio" name="sp" value="0">ゆっくり Slow</label><label><input type="radio" name="sp" value="1" checked>ふつう Normal</label><label><input type="radio" name="sp" value="2">はやい Fast</label></div></section>
  </aside>
  <canvas id="fly" aria-hidden="true" style="z-index:8;pointer-events:none"></canvas>
  <div class="toast" id="toast" role="status"></div>
  <p class="sr" id="hl" aria-live="polite"></p>
</div>
<script>
(() => {
'use strict';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2, INK = '#1a1a1a';
const TIERS = [
  { jp:'白', en:'White', price:120, rim:'#f4ead2' }, { jp:'緑', en:'Green', price:180, rim:'#2f8f83' }, { jp:'赤', en:'Red', price:260, rim:'#d8382a' },
  { jp:'金', en:'Gold', price:380, rim:'#e9b326' }, { jp:'黒', en:'Black', price:520, rim:'#1a1a1a' }
];
const MENU = [
  { jp:'玉子', en:'Tamago nigiri', tier:0, type:'nigiri', top:'#f5c842', band:true, desc:'Sweet rolled omelette, tied on with a strip of nori.', alg:'Egg, soy' },
  { jp:'いなり', en:'Inari pouch', tier:0, type:'inari', desc:'Seasoned rice tucked into a sweet fried-tofu pouch.', alg:'Soy, sesame' },
  { jp:'かっぱ巻', en:'Cucumber maki', tier:0, type:'maki', fill:'#5fae4c', desc:'Crisp cucumber and toasted sesame, rolled in nori.', alg:'Sesame' },
  { jp:'サーモン', en:'Salmon nigiri', tier:1, type:'nigiri', top:'#f28a4b', stripes:'#ffd6bd', desc:'Norwegian salmon over rice seasoned with red vinegar.', alg:'Fish' },
  { jp:'海老', en:'Prawn nigiri', tier:1, type:'ebi', desc:'Butterflied prawn, poached and brushed with sweet vinegar.', alg:'Crustaceans' },
  { jp:'鉄火巻', en:'Tuna maki', tier:1, type:'maki', fill:'#c2262e', desc:'Lean tuna rolled tight in rice and nori.', alg:'Fish' },
  { jp:'枝豆', en:'Edamame', tier:1, type:'edamame', desc:'Warm soybeans in the pod with flaky sea salt.', alg:'Soy' },
  { jp:'まぐろ', en:'Tuna nigiri', tier:2, type:'nigiri', top:'#b3202b', stripes:'#d2464d', desc:'Lean bluefin akami, brushed with house soy.', alg:'Fish, soy' },
  { jp:'いくら', en:'Salmon roe gunkan', tier:2, type:'gunkan', topping:'ikura', desc:'Glistening salmon roe in a crisp nori boat.', alg:'Fish' },
  { jp:'海老天巻', en:'Prawn tempura roll', tier:2, type:'maki', fill:'#f0a23a', desc:'Crunchy prawn tempura with a little spicy mayo.', alg:'Crustaceans, egg, wheat' },
  { jp:'うなぎ', en:'Grilled eel', tier:3, type:'nigiri', top:'#6b3a1f', band:true, glaze:true, desc:'Freshwater eel grilled over charcoal with sweet tare.', alg:'Fish, soy, wheat' },
  { jp:'うに', en:'Sea urchin gunkan', tier:3, type:'gunkan', topping:'uni', desc:'Creamy sea urchin from Hokkaido, served cold.', alg:'Shellfish' },
  { jp:'大トロ', en:'Fatty tuna', tier:3, type:'nigiri', top:'#f08a96', stripes:'#ffe3e6', desc:'The marbled belly of bluefin — melts on the tongue.', alg:'Fish' },
  { jp:'和牛炙り', en:'Seared wagyu', tier:4, type:'nigiri', top:'#c8475a', stripes:'#f6c9cf', seared:true, desc:'A5 wagyu kissed with a blowtorch, finished with flaky salt.', alg:'None listed' },
  { jp:'特上盛', en:'Chef’s trio', tier:4, type:'trio', desc:'Otoro, uni and ikura — whatever the chef loves today.', alg:'Fish, shellfish' }
];
$('#tiers').innerHTML = TIERS.map(t => `<div style="--rim:${t.rim}"><i></i>¥${t.price}</div>`).join('');

/* ---------------- geometry ---------------- */
const cv = $('#belt'), gBelt = cv.getContext('2d'), fly = $('#fly'), gFly = fly.getContext('2d'), stage = $('#stage');
let g = gBelt;
let W, H, DPR, mobile, cx, cy, L, r, pr, P, vertical;
function layout(){
  W = stage.clientWidth; H = stage.clientHeight; DPR = Math.min(2, devicePixelRatio || 1); mobile = W <= 820; vertical = mobile;
  for (const c of [cv, fly]) { c.width = W * DPR; c.height = H * DPR; c.style.width = W + 'px'; c.style.height = H + 'px'; }
  if (!vertical) { const right = 350; const aw = W - right - 30, ah = H - 110; r = Math.min(160, ah / 2 - 60); pr = Math.min(44, r * 0.28); L = Math.max(120, (aw - 2 * r - 2 * pr * 1.25 - 70) / 2); cx = 24 + aw / 2; cy = 96 + ah / 2; }
  else { const top = 64, bottom = 200; r = Math.min(120, (W - 110) / 2); const ah = H - top - bottom; L = Math.max(80, (ah - 2 * r - 70) / 2); cx = W / 2; cy = top + ah / 2; pr = Math.min(30, r * 0.26); }
  P = 4 * L + 2 * Math.PI * r;
  const isl = $('#island'); isl.style.left = cx + 'px'; isl.style.top = cy + 'px';
  const card = $('#card'); card.style.left = cx + 'px'; card.style.top = cy + 'px';
  buildSlots();
}
function local(s){ // position along the loop in belt space: u along length, v across
  s = ((s % P) + P) % P;
  if (s < 2 * L) return { u: -L + s, v: -r, a: 0 };
  s -= 2 * L; if (s < Math.PI * r) { const t = s / r; return { u: L + Math.sin(t) * r, v: -Math.cos(t) * r, a: t }; }
  s -= Math.PI * r; if (s < 2 * L) return { u: L - s, v: r, a: Math.PI };
  s -= 2 * L; const t = s / r; return { u: -L - Math.sin(t) * r, v: Math.cos(t) * r, a: Math.PI + t };
}
const toXY = (u, v) => vertical ? { x: cx - v, y: cy + u } : { x: cx + u, y: cy + v };
const inKitchen = s => { s = ((s % P) + P) % P; return s > 4 * L + Math.PI * r - 2 || s < 2; };

/* ---------------- belt state ---------------- */
let slots = [], offset = 0, speeds = [34, 62, 110], speed = speeds[1], plateId = 0, sel = null, hlIdx = -1;
function newPlate(){ const it = MENU[Math.floor(Math.random() * MENU.length)]; return { id: ++plateId, it, laps: 0, fresh: 1, wob: 0 }; }
function buildSlots(){
  const spacing = pr * 2.7, n = Math.floor(P / spacing), old = slots.map(s => s.plate).filter(Boolean);
  slots = [];
  for (let k = 0; k < n; k++) slots.push({ base: k * (P / n), plate: old.length ? old.shift() : (k % 5 !== 3 ? Object.assign(newPlate(), { fresh: 0 }) : null), lastS: null });
}
const slotS = sl => ((sl.base + offset) % P + P) % P;
function plateXY(sl){ const l = local(slotS(sl)); return toXY(l.u, l.v); }

/* ---------------- tray ---------------- */
const tray = [0, 0, 0, 0, 0];
function renderTray(){
  const wood = $('#wood'); const n = tray.reduce((a, b) => a + b, 0), tot = tray.reduce((a, c, i) => a + c * TIERS[i].price, 0);
  wood.innerHTML = n ? TIERS.map((t, i) => tray[i] ? `<button class="stack" type="button" data-t="${i}" style="--rim:${t.rim}" aria-label="${tray[i]} ${t.en.toLowerCase()} plate${tray[i] > 1 ? 's' : ''}, ¥${t.price} each. Put one back on the belt.">${'<i></i>'.repeat(Math.min(tray[i], mobile ? 6 : 12))}<b>${tray[i]}</b></button>` : '').join('') : '<span class="empty">Drop plates here</span>';
  $('#plates').textContent = `${n} PLATE${n === 1 ? '' : 'S'}`; $('#total').textContent = '¥' + tot.toLocaleString('en-GB');
  $('#bill').disabled = !n;
}
$('#wood').addEventListener('click', e => { const b = e.target.closest('.stack'); if (!b) return; putBack(+b.dataset.t); });
function putBack(t){
  audio(); if (!tray[t]) return; tray[t]--; renderTray();
  // the first empty, visible slot near the front gets a plate of that tier
  const it = MENU.filter(m => m.tier === t)[0];
  let best = null, bd = 1e9; slots.forEach(sl => { const s = slotS(sl); if (!sl.plate && !inKitchen(s)) { const d = Math.abs(s - L * 0.5); if (d < bd) { bd = d; best = sl; } } });
  const p = Object.assign(newPlate(), { it: lastTaken[t] || it, fresh: 0 });
  if (best) { best.plate = p; p.wob = 1; }
  toast(`Put a ${TIERS[t].en.toLowerCase()} plate back on the belt`); clink(0.6);
}
const lastTaken = {};
$('#bill').addEventListener('click', () => { const n = tray.reduce((a, b) => a + b, 0), tot = tray.reduce((a, c, i) => a + c * TIERS[i].price, 0); audio(); bell(); toast(`Bill on its way · ${n} plates · ¥${tot.toLocaleString('en-GB')}`); });

/* ---------------- speed knob ---------------- */
document.querySelectorAll('.opts input').forEach(inp => inp.addEventListener('change', () => { const i = +inp.value; speed = speeds[i]; $('#ptr').style.transform = `rotate(${(i - 1) * 60}deg)`; audio(); clunk(); }));

/* ---------------- interaction ---------------- */
let drag = null, flying = [];
function hit(x, y){ let best = null, bd = pr * 1.05; slots.forEach(sl => { if (!sl.plate || inKitchen(slotS(sl))) return; const p = plateXY(sl), d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = sl; } }); return best; }
function overTray(x, y){ const r0 = $('#wood').getBoundingClientRect(), rs = stage.getBoundingClientRect(); const X = x + rs.left, Y = y + rs.top; return X > r0.left - 20 && X < r0.right + 20 && Y > r0.top - 30 && Y < r0.bottom + 20; }
cv.addEventListener('pointerdown', e => {

    let to = f.toTray || plateXY(f.to); const x = f.from.x + (to.x - f.from.x) * e, y = f.from.y + (to.y - f.from.y) * e - Math.sin(Math.PI * f.t) * (f.toTray ? 60 : 20);
    drawPlate(f.plate, x, y, f.toTray ? 1.1 - 0.5 * e : 1.1 - 0.1 * e, false);
    if (f.t >= 1) { flying.splice(i, 1); if (f.toTray) landInTray(f.plate); else { if (!f.to.plate) { f.to.plate = f.plate; f.plate.wob = 1; } clink(0.4); } } }
  if (drag && drag.moved) drawPlate(drag.plate, drag.cx - drag.ox, drag.cy - drag.oy, 1.12, false);
  g = gBelt;
  requestAnimationFrame(frame);
}
