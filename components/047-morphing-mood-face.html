<style>
:root{--ink:#14110d;--paper:#efe6cf;--paper2:#d9ceb4;--grey:#a69d89}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0b0a08;color:var(--ink);font-family:"Old Standard TT",Georgia,serif;overflow:hidden}
.film{position:fixed;inset:0;display:flex;justify-content:center;align-items:center}
.strip{position:relative;height:100%;width:min(100vw,1040px);background:#16130f;padding:16px 64px;
  background-image:radial-gradient(ellipse 13px 9px at 32px 50%,#0b0a08 98%,transparent 100%),radial-gradient(ellipse 13px 9px at calc(100% - 32px) 50%,#0b0a08 98%,transparent 100%);
  background-size:100% 34px;background-repeat:repeat-y;box-shadow:0 0 80px rgba(0,0,0,.8)}
.strip::before,.strip::after{content:"";position:absolute;top:0;bottom:0;width:64px;background:repeating-linear-gradient(transparent 0 30px,rgba(255,240,200,.05) 30px 34px);pointer-events:none}
.strip::before{left:0}.strip::after{right:0}
.edge{position:absolute;left:8px;top:40%;writing-mode:vertical-rl;transform:rotate(180deg);font:700 10px/1 "Old Standard TT",serif;letter-spacing:.3em;color:#b8955a;opacity:.6}
.frame{position:relative;width:100%;height:100%;border-radius:26px/22px;overflow:hidden;background:var(--paper);touch-action:none;cursor:grab;outline:none}
.frame.drag{cursor:grabbing}
.frame:focus-visible{box-shadow:0 0 0 4px #e9c46a}
.weave{position:absolute;inset:-4px;will-change:transform}
#scene{position:absolute;left:0;right:0;top:120px;bottom:178px;width:100%;height:calc(100% - 298px);overflow:visible}
.title{position:absolute;left:0;right:0;top:20px;text-align:center;pointer-events:none}
.title .banner{display:inline-block;position:relative;padding:10px 40px 12px;background:var(--paper);border:4px solid var(--ink);border-radius:46px/38px;box-shadow:6px 6px 0 var(--ink)}
.title .banner::before,.title .banner::after{content:"";position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--ink)}
.title .banner::before{left:14px}.title .banner::after{right:14px}
.title h1{font-family:"Limelight",Georgia,serif;font-weight:400;font-size:32px;letter-spacing:.02em;line-height:1.05}
.title p{font-style:italic;font-size:15px;margin-top:2px}
.scale{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);width:min(640px,90%);height:70px;display:flex;background:var(--ink);padding:7px 0;border-radius:4px;touch-action:none;cursor:pointer}

.scale::before{top:0}.scale::after{bottom:0}
.stop{flex:1;margin:0 3px;background:var(--paper2);display:grid;place-items:center;font-family:"Limelight",serif;font-size:16px;border-radius:3px;transition:background .25s;appearance:none;border:0;color:var(--ink);cursor:pointer}
.stop.on{background:var(--paper)}
.stop:focus-visible{outline:3px solid #e9c46a;outline-offset:-3px}
.pointer{position:absolute;top:-38px;left:0;width:44px;height:40px;margin-left:-22px;pointer-events:none;transition:none}
.send{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);appearance:none;cursor:pointer;background:var(--paper);color:var(--ink);font-family:"Limelight",serif;font-size:20px;padding:10px 30px 9px;border:4px solid var(--ink);border-radius:30px;box-shadow:5px 5px 0 var(--ink);transition:transform .15s cubic-bezier(.3,1.8,.5,1),box-shadow .15s}
.send:hover{transform:translateX(-50%) rotate(-2deg) scale(1.05)}

.card.on{display:grid}

.card h2{font-family:"Limelight",serif;font-weight:400;font-size:40px}
.card p{font-size:18px;font-style:italic;margin-top:12px;line-height:1.4}

.mute{position:absolute;right:76px;bottom:28px;width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);cursor:pointer;display:grid;place-items:center;z-index:3}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

<script>
(()=>{
'use strict';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const frame=$('frame');
const LABELS=['Awful','Not great','Okay','Good','Wonderful'];
let v=.5, vT=.5, vVel=0, dragging=false, sY=0, sV=0, stretch=0, stretchV=0, stretchT=0, phase=0, gaze=[0,0], hatY=0, hatV=0, hatRot=0, hatPopped=false, sent=false, irisR=2000, irisT=2000;
let lastExtreme=0;

/* flowers on the backdrop */
(function flowers(){const g=$('flowers');let s='';for(let i=0;i<14;i++){const x=-760+i*118+(i%3)*14,y=196+(i%2)*14;s+=`<g class="fl" data-x="${x}" data-y="${y}"><path d="M${x} ${y}v-30" stroke="#14110d" stroke-width="3"/><g transform="translate(${x} ${y-34})"><circle r="9" fill="#efe6cf" stroke="#14110d" stroke-width="3"/><circle r="3.5" fill="#14110d"/></g></g>`;}g.innerHTML=s;})();
const fls=[...document.querySelectorAll('.fl')];
/* stars */
(function(){let s='';for(let i=0;i<4;i++)s+=`<path class="st" d="M0-16 4-5 16-5 6 2 10 14 0 7-10 14-6 2-16-5-4-5Z" fill="#efe6cf" stroke="#14110d" stroke-width="3"/>`;$('stars').innerHTML=s;})();
const starEls=[...document.querySelectorAll('.st')];
/* rain drops */
(function(){let s='';for(let i=0;i<9;i++)s+=`<line class="dr" x1="0" y1="0" x2="-3" y2="16"/>`;$('drops').innerHTML=s;})();
const drops=[...document.querySelectorAll('.dr')].map((d,i)=>({el:d,x:-70+i*17,y:Math.random()*120}));
const tears=[];

/* ---------- sound ---------- */
let AC=null,master=null,muted=false,wh=null,whG=null,lfo=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}
  master=AC.createGain();master.gain.value=muted?0:.17;master.connect(AC.destination);
  wh=AC.createOscillator();wh.type='sine';whG=AC.createGain();whG.gain.value=0;lfo=AC.createOscillator();lfo.frequency.value=5.5;const lg=AC.createGain();lg.gain.value=9;lfo.connect(lg).connect(wh.frequency);
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=3000;wh.connect(f).connect(whG).connect(master);wh.start();lfo.start();}
  if(AC.state==='suspended')AC.resume();return AC}
function whistle(level){if(!wh)return;const t=AC.currentTime;wh.frequency.setTargetAtTime(330+v*1050,t,.02);whG.gain.setTargetAtTime(Math.min(.35,level),t,.05);}
function note(f,d,t0,type='sawtooth',vol=.22,bend=0){const a=audio();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain(),lp=a.createBiquadFilter();o.type=type;o.frequency.setValueAtTime(f,t);if(bend)o.frequency.linearRampToValueAtTime(f*bend,t+d);
  lp.type='lowpass';lp.frequency.value=1100;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.03);g.gain.setValueAtTime(vol,t+d*.7);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(lp).connect(g).connect(master);o.start(t);o.stop(t+d+.05);}
function sadTrombone(){[[233.08,.42],[220,.42],[207.65,.42],[196,1.3]].reduce((t,[f,d])=>{note(f,d,t,'sawtooth',.2,d>1?.97:1);return t+d*.95},0);}
function boing(){const a=audio();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain(),l=a.createOscillator(),lg=a.createGain();o.type='triangle';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(520,t+.35);
  l.frequency.value=22;lg.gain.value=40;l.connect(lg).connect(o.frequency);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.6);o.connect(g).connect(master);o.start(t);l.start(t);o.stop(t+.62);l.stop(t+.62);}
function honk(){note(370,.12,0,'square',.18,.9);note(370,.18,.16,'square',.18,.85);}
function xylo(){[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>note(f,.25,i*.07,'sine',.2));}
$('mute').addEventListener('click',e=>{e.stopPropagation();muted=!muted;$('mute').setAttribute('aria-pressed',muted);$('mute').setAttribute('aria-label',muted?'Unmute sound':'Mute sound');$('mw').style.opacity=muted?.15:1;if(master)master.gain.value=muted?0:.17;});

/* ---------- film grain ---------- */
const gc=$('grain'),gx=gc.getContext('2d');let tiles=[];
function makeGrain(){const r=frame.getBoundingClientRect();gc.width=Math.ceil(r.width/2);gc.height=Math.ceil(r.height/2);
  tiles=[0,1,2].map(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),im=g.createImageData(128,128);
    for(let i=0;i<128*128;i++){const n=Math.random();const val=n<.06?120+Math.random()*60:255-Math.random()*30;im.data[i*4]=val;im.data[i*4+1]=val*.97;im.data[i*4+2]=val*.92;im.data[i*4+3]=255;}g.putImageData(im,0,0);return c;});}
let gFrame=0;
function drawGrain(){const w=gc.width,h=gc.height;gx.fillStyle=gx.createPattern(tiles[gFrame%3],'repeat');gx.save();gx.translate((Math.random()*128)|0,(Math.random()*128)|0);gx.fillRect(-128,-128,w+256,h+256);gx.restore();
  if(Math.random()<.35){gx.strokeStyle='rgba(30,20,10,.55)';gx.lineWidth=Math.random()<.5?1:1.6;const x=Math.random()*w;gx.beginPath();gx.moveTo(x,0);gx.lineTo(x+(Math.random()-.5)*6,h);gx.stroke();}
  for(let i=0;i<4;i++){if(Math.random()<.5){gx.fillStyle=Math.random()<.5?'rgba(20,14,8,.7)':'rgba(255,255,255,.9)';gx.beginPath();gx.ellipse(Math.random()*w,Math.random()*h,Math.random()*2.5+.5,Math.random()*1.5+.4,Math.random()*3,0,7);gx.fill();}}
  if(Math.random()<.04){gx.strokeStyle='rgba(20,14,8,.5)';gx.lineWidth=1;gx.beginPath();const x=Math.random()*w,y=Math.random()*h;gx.moveTo(x,y);gx.bezierCurveTo(x+10,y-8,x+16,y+8,x+24,y+2);gx.stroke();}
  gFrame++;}

/* ---------- character pose ---------- */
const S=(id)=>$(id);
const el={face:S('face'),mouth:S('mouth'),tongue:S('tongue'),browL:S('browL'),browR:S('browR'),chkL:S('chkL'),chkR:S('chkR'),hat:S('hat'),gloveL:S('gloveL'),gloveR:S('gloveR'),
  armL0:S('armL0'),armL1:S('armL1'),armR0:S('armR0'),armR1:S('armR1'),legL0:S('legL0'),legL1:S('legL1'),legR0:S('legR0'),legR1:S('legR1'),shoeL:S('shoeL'),shoeR:S('shoeR'),body:S('body'),shadow:S('shadow'),rain:S('rain'),stars:S('stars'),head:S('head')};
const eyes=['eyeL','eyeR'].map((id,i)=>{const g=$(id);return{g,ec:$(i?'ecR':'ecL').querySelector('.ec'),eo:g.querySelector('.eo'),ew:g.querySelector('.ew'),pup:g.querySelector('.pup'),pie:g.querySelector('.pie'),lu:g.querySelector('.lidU'),ld:g.querySelector('.lidD')}});
const lerp=(a,b,t)=>a+(b-a)*t, cl=(x,a,b)=>Math.max(a,Math.min(b,x)), sm=t=>t*t*(3-2*t);
function pw(m,sad,mid,hap){return m<0?lerp(mid,sad,-m):lerp(mid,hap,m)}
function hose(x0,y0,x1,y1,bow){const mx=(x0+x1)/2,my=(y0+y1)/2,dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy)||1;const cx=mx-dy/L*bow,cy=my+dx/L*bow;return `M${x0} ${y0}Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}`}
function pose(now){
  const m=v*2-1, hap=Math.max(0,m), sad=Math.max(0,-m), t=now/1000;
  // bounce
  const bpm=pw(m,54,96,140),amp=(dragging?.25:1)*pw(m,3,10,30)*(RM?0:1);
  const s=Math.abs(Math.sin(phase)),contact=Math.pow(1-s,5);
  const by=-s*amp, sqY=1-contact*.07*(amp/14)+stretch, sqX=1+contact*.06*(amp/14)-stretch*.5;
  el.body.setAttribute('transform',`translate(0 ${(by+(sad*18)).toFixed(2)}) translate(0 240) scale(${sqX.toFixed(4)} ${sqY.toFixed(4)}) translate(0 -240)`);
  el.shadow.setAttribute('rx',(92*(1-s*amp/140)).toFixed(1));el.shadow.setAttribute('opacity',(.28-s*amp/400).toFixed(3));
  // head tilt & droop
  const tilt=sad*-6*Math.sin(t*.8)+hap*5*Math.sin(phase);
  el.head.setAttribute('transform',`rotate(${tilt.toFixed(2)}) translate(0 ${(sad*10).toFixed(1)})`);
  // face shape (slight squash with mood)
  const fy=pw(m,1.04,1,.96);el.face.setAttribute('d',`M0 ${-98*fy}C54 ${-98*fy} 98 ${-54*fy} 98 0S54 ${98*fy} 0 ${98*fy} -98 ${54*fy} -98 0 -54 ${-98*fy} 0 ${-98*fy}Z`);
  // eyes
  const eyeSpread=pw(m,30,33,35),eyeY=pw(m,-14,-20,-24),ry=pw(m,24,30,28);
  eyes.forEach((e,i)=>{const sgn=i?1:-1,ex=sgn*eyeSpread;e.g.setAttribute('transform',`translate(${ex} ${eyeY})`);e.ew.setAttribute('ry',ry);e.ec.setAttribute('ry',ry);e.eo.setAttribute('ry',ry);
    const px=cl(gaze[0],-1,1)*6,py=cl(gaze[1],-1,1)*7+sad*7;e.pup.setAttribute('transform',`translate(${px.toFixed(1)} ${py.toFixed(1)}) scale(1 ${(ry/30).toFixed(3)})`);
    e.pie.setAttribute('transform',`rotate(${(Math.atan2(gaze[1],gaze[0])*180/Math.PI+135).toFixed(0)})`);
    // upper lid: droops outward when sad
    const lidIn=-ry-2+sad*ry*.5,lidOut=-ry-2+sad*ry*1.05;const li=sgn<0?lidOut:lidIn,lo=sgn<0?lidIn:lidOut;
    e.lu.setAttribute('d',`M-26 ${-ry-10}H26V${(sgn<0?lidIn:lidOut).toFixed(1)}L-26 ${(sgn<0?lidOut:lidIn).toFixed(1)}Z`);
    e.lu.style.display=sad>.05?'':'none';
    // lower lid rises as a happy crescent
    const ll=ry+2-hap*hap*ry*1.3,edge=ry*.55-hap*ry*.25;e.ld.setAttribute('d',`M-26 ${ry+10}V${edge.toFixed(1)}Q0 ${ll.toFixed(1)} 26 ${edge.toFixed(1)}V${ry+10}Z`);e.ld.style.display=hap>.35?'':'none';
  });
  // brows
  [el.browL,el.browR].forEach((b,i)=>{const sgn=i?1:-1;const inX=sgn*12,outX=sgn*54,base=eyeY-ry-14;
    const inY=base+pw(m,-16,0,-12),outY=base+pw(m,10,0,-8),midY=Math.min(inY,outY)+pw(m,2,-6,-14);
    b.setAttribute('d',`M${inX} ${inY.toFixed(1)}Q${(sgn*33)} ${midY.toFixed(1)} ${outX} ${outY.toFixed(1)}`);});
  // mouth
  const cw=pw(m,34,30,46), cy=pw(m,58,50,40), mid=pw(m,34,52,62), open=cl((m-.15)/.85,0,1), wob=sad>.4?Math.sin(t*22)*sad*3:0;
  const top=cy+(mid-cy)*.25*(1-open);const bot=mid+open*42;
  if(open>.02){el.mouth.setAttribute('d',`M${-cw} ${cy}Q0 ${top+open*6} ${cw} ${cy}Q${cw*.6} ${bot} 0 ${bot}Q${-cw*.6} ${bot} ${-cw} ${cy}Z`);
    el.tongue.setAttribute('d',`M${-cw*.45} ${bot-open*12}Q0 ${bot-open*24} ${cw*.45} ${bot-open*12}Q${cw*.3} ${bot-2} 0 ${bot-2}Q${-cw*.3} ${bot-2} ${-cw*.45} ${bot-open*12}Z`);el.tongue.style.display='';el.mouth.setAttribute('fill','#14110d');}
  else{const midC=cy+(mid-cy)*1.6;el.mouth.setAttribute('d',`M${-cw} ${cy+wob}Q${-cw*.5} ${(midC+wob*-1).toFixed(1)} 0 ${midC.toFixed(1)}Q${cw*.5} ${(midC+wob).toFixed(1)} ${cw} ${cy-wob}`);el.mouth.setAttribute('fill','none');el.tongue.style.display='none';}
  el.chkL.setAttribute('opacity',cl((m-.2)*1.6,0,1).toFixed(2));el.chkR.setAttribute('opacity',cl((m-.2)*1.6,0,1).toFixed(2));
  // arms: shoulders (±92,20)
  const wave=hap>.6?Math.sin(t*9)*18*(hap-.6)*2.5:0;
  const hand=(sgn)=>{const sadP=[sgn*70,128],midP=[sgn*150,62],hapP=[sgn*(150+wave*sgn*.3),-150+Math.abs(wave)*.4];const p=m<0?[lerp(midP[0],sadP[0],sad),lerp(midP[1],sadP[1],sad)]:[lerp(midP[0],hapP[0],sm(hap)),lerp(midP[1],hapP[1],sm(hap))];
    const sw=Math.sin(phase*2+(sgn>0?1:0))*amp*.25;return[p[0],p[1]+sw]};
  [['armL',-1,el.gloveL],['armR',1,el.gloveR]].forEach(([k,sgn,gl])=>{const [hx,hy]=hand(sgn);const sx=sgn*90,sy=24;const bow=sgn*pw(m,-18,26,-30);const d=hose(sx,sy,hx,hy,bow);
    el[k+'0'].setAttribute('d',d);el[k+'1'].setAttribute('d',d);
    const ang=Math.atan2(hy-sy,hx-sx)*180/Math.PI;gl.setAttribute('transform',`translate(${hx.toFixed(1)} ${hy.toFixed(1)}) rotate(${(ang+wave*sgn*.6).toFixed(1)}) scale(${sgn<0?1:1} ${sgn<0?-1:1})`);});
  // legs
  const knee=contact*14+pw(m,10,0,0);
  [['legL',-1,el.shoeL],['legR',1,el.shoeR]].forEach(([k,sgn,sh])=>{const d=hose(sgn*36,86,sgn*52,226,sgn*(-knee-6));el[k+'0'].setAttribute('d',d);el[k+'1'].setAttribute('d',d);
    sh.setAttribute('transform',`translate(${sgn*64} 232) rotate(${(sgn*pw(m,-4,4,10)).toFixed(1)})`);});
  // hat: sits on head, pops at glee, sinks at gloom
  const hatBase=-96+sad*sad*46;el.hat.setAttribute('transform',`translate(${(hatPopped?Math.sin(hatRot*.05)*6:0).toFixed(1)} ${(hatBase+hatY).toFixed(1)}) rotate(${(hatRot+tilt).toFixed(1)}) scale(${(1+sad*.12).toFixed(3)})`);
  // extremes
  el.rain.setAttribute('opacity',cl((sad-.6)/.25,0,1).toFixed(2));el.stars.setAttribute('opacity',cl((hap-.7)/.2,0,1).toFixed(2));
  // flowers droop/perk
  fls.forEach((f,i)=>{const x=+f.dataset.x,y=+f.dataset.y;f.setAttribute('transform',`rotate(${(pw(m,40,0,0)*(i%2?1:-1)+Math.sin(phase*2+i)*pw(m,1,4,9)).toFixed(1)} ${x} ${y})`);});
}

/* ---------- value & UI ---------- */
function label(){return LABELS[Math.min(4,Math.round(v*4))]}
let lastLabel='Okay';
function updateUI(announce){
  const sc=(1+v*4).toFixed(1),lb=label();$('rLabel').textContent=lb;$('rScore').textContent=`${sc} out of 5`;
  frame.setAttribute('aria-valuenow',sc);frame.setAttribute('aria-valuetext',`${lb}, ${sc} out of 5`);
  document.querySelectorAll('.stop').forEach((s,i)=>s.classList.toggle('on',i===Math.min(4,Math.round(v*4))));
  const sr=$('scale').getBoundingClientRect();$('pointer').style.left=(7+v*(sr.width-14))+'px';
  // film tint: blue (gloom) → sepia → rose-amber (glee)
  const m=v*2-1;const A=[150,178,214],B=[232,212,170],Cc=[246,190,160];const c=m<0?A.map((a,i)=>lerp(B[i],a,-m)):Cc.map((a,i)=>lerp(B[i],a,m));
  $('tint').style.background=`rgb(${c.map(x=>x|0).join(',')})`;
  if(lb!==lastLabel){lastLabel=lb;if(announce)$('live').textContent=`${lb}, ${sc} out of 5`;}
}
function setV(nv,src){nv=cl(nv,0,1);
  if(nv<.04&&v>=.04&&lastExtreme!==-1){lastExtreme=-1;sadTrombone();}
  if(nv>.96&&v<=.96&&lastExtreme!==1){lastExtreme=1;boing();hatPopped=true;hatV=-900;}
  if(nv>.2&&nv<.8)lastExtreme=0;
  v=nv;vT=nv;updateUI(src==='key');}
/* pointer drag on the frame */
let lastY=0,lastT=0;
frame.addEventListener('pointerdown',e=>{if(sent||e.target.closest('button')||e.target.closest('.scale'))return;audio();dragging=true;frame.classList.add('drag');sY=lastY=e.clientY;sV=v;lastT=performance.now();try{frame.setPointerCapture(e.pointerId)}catch(_){}$('hint').classList.add('gone');});
frame.addEventListener('pointermove',e=>{const r=frame.getBoundingClientRect();const hc=$('scene').getBoundingClientRect();gaze=[(e.clientX-(hc.left+hc.width/2))/(hc.width*.35),(e.clientY-(hc.top+hc.height*.42))/(hc.height*.4)];
  if(!dragging)return;const now=performance.now(),dy=e.clientY-lastY;const sp=Math.abs(dy)/Math.max(8,now-lastT);lastY=e.clientY;lastT=now;
  setV(sV-(e.clientY-sY)/(r.height*.55));stretchT=cl(-(e.clientY-sY)/900,-.16,.16)*(v>0&&v<1?1:1.6);whistle(sp*.5);});
const end=()=>{if(!dragging)return;dragging=false;frame.classList.remove('drag');stretchT=0;whistle(0);updateUI(true);$('live').textContent=`${label()}, ${(1+v*4).toFixed(1)} out of 5`;};
frame.addEventListener('pointerup',end);frame.addEventListener('pointercancel',end);
frame.addEventListener('pointerleave',()=>{if(!dragging)gaze=[0,.1];});
/* scale scrubbing */
const scale=$('scale');let scr=false;
const scrub=e=>{const r=scale.getBoundingClientRect();setV((e.clientX-r.left-7)/(r.width-14));};
scale.addEventListener('pointerdown',e=>{if(sent)return;audio();scr=true;try{scale.setPointerCapture(e.pointerId)}catch(_){}scrub(e);whistle(.25);$('hint').classList.add('gone');e.preventDefault();});
scale.addEventListener('pointermove',e=>{if(scr){scrub(e);whistle(.2);}});
scale.addEventListener('pointerup',()=>{scr=false;whistle(0);updateUI(true);});scale.addEventListener('pointercancel',()=>{scr=false;whistle(0);});
/* keyboard */
frame.addEventListener('keydown',e=>{if(sent||e.target!==frame)return;let d=0;if(e.key==='ArrowUp'||e.key==='ArrowRight')d=.05;else if(e.key==='ArrowDown'||e.key==='ArrowLeft')d=-.05;else if(e.key==='PageUp')d=.25;else if(e.key==='PageDown')d=-.25;
  else if(e.key==='Home'){e.preventDefault();audio();setV(0,'key');return}else if(e.key==='End'){e.preventDefault();audio();setV(1,'key');return}
  else if(e.key==='Enter'){e.preventDefault();send();return}else return;
  e.preventDefault();audio();setV(v+d,'key');whistle(.25);setTimeout(()=>whistle(0),140);$('hint').classList.add('gone');});
/* nose honk easter egg */
$('nose').addEventListener('pointerdown',e=>{e.stopPropagation();audio();honk();stretch=-.12;stretchV=0;});
/* send */
function send(){if(sent)return;audio();sent=true;xylo();irisT=0;const lb=label(),sc=(1+v*4).toFixed(1);
  const msg=v<.25?['Oh dear.','Sorry it went badly. A team lead will read this chat today.']:v<.55?['Noted, thank you.','We’ll look at how this chat could have gone better.']:v<.85?['Thanks kindly!','Priya will be glad to hear it.']:['Hooray!','Priya will hear all about it — this one goes on the wall.'];
  setTimeout(()=>{$('cTitle').textContent=msg[0];$('cText').textContent=`You rated the chat ${lb.toLowerCase()} (${sc} / 5). ${msg[1]}`;$('card').classList.add('on');$('again').focus();},RM?0:1100);
  $('live').textContent=`Rating sent: ${lb}, ${sc} out of 5`;}
$('send').addEventListener('click',e=>{e.stopPropagation();send();});
$('again').addEventListener('click',()=>{sent=false;$('card').classList.remove('on');irisT=2000;frame.focus();});

/* ---------- loop ---------- */
let lt=performance.now(),boilT=0,grainT=0,seed=1;
function loop(now){
  const dt=Math.min(.05,(now-lt)/1000);lt=now;
  if(!document.hidden){
    const m=v*2-1;phase+=dt*Math.PI*pw(m,54,96,140)/60*(RM?0:1);
    const k=dragging?600:220,c=dragging?40:9;const sa=(stretchT-stretch)*k-stretchV*c;stretchV+=sa*dt;stretch+=stretchV*dt;
    // hat physics
    if(hatPopped){hatV+=2600*dt;hatY+=hatV*dt;hatRot+=dt*720;if(hatY>0){hatY=0;hatV=0;hatPopped=false;hatRot=0;}}
    if(boilT<=now){boilT=now+83;$('boilT').setAttribute('seed',String((seed=(seed%9)+1)));}
    pose(now);
    // extremes animation
    if(v<.2){drops.forEach(d=>{d.y+=dt*260;if(d.y>140)d.y=0;d.el.setAttribute('transform',`translate(${d.x} ${(-240+d.y).toFixed(1)})`);});
      if(v<.12&&Math.random()<dt*2.2&&tears.length<4){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d','M0-8C3-3 6 2 6 5a6 6 0 0 1-12 0C-6 2-3-3 0-8Z');p.setAttribute('fill','#efe6cf');p.setAttribute('stroke','#14110d');p.setAttribute('stroke-width','3');$('tears').appendChild(p);tears.push({el:p,x:(Math.random()<.5?-1:1)*(30+Math.random()*12),y:4,vy:20});}}
    for(let i=tears.length-1;i>=0;i--){const tr=tears[i];tr.vy+=320*dt;tr.y+=tr.vy*dt;tr.el.setAttribute('transform',`translate(${tr.x} ${tr.y.toFixed(1)})`);if(tr.y>120){tr.el.remove();tears.splice(i,1);}}
    if(v>.8){starEls.forEach((s,i)=>{const a=now/700+i*Math.PI/2;s.setAttribute('transform',`translate(${(Math.cos(a)*150).toFixed(1)} ${(-150+Math.sin(a)*34).toFixed(1)}) rotate(${(a*60).toFixed(0)}) scale(${(.8+.3*Math.sin(a*2)).toFixed(2)})`);});}
    // film: grain 24fps, weave, flicker
    if(grainT<=now){grainT=now+42;drawGrain();if(!RM){$('weave').style.transform=`translate(${(Math.random()-.5)*1.6}px,${(Math.random()-.5)*2.2}px)`;$('flicker').style.opacity=(Math.random()*.08).toFixed(3);}}
    // iris
    irisR+=(irisT-irisR)*Math.min(1,dt*(irisT<irisR?2.6:3.5));if(RM)irisR=irisT;
    const fr=frame.getBoundingClientRect();const ic=$('irisC');ic.setAttribute('r',Math.max(0,irisT===0?Math.max(0,irisR-40):irisR).toFixed(1));
    const hc=$('scene').getBoundingClientRect();ic.setAttribute('cx',(hc.left+hc.width/2-fr.left).toFixed(0));ic.setAttribute('cy',(hc.top+hc.height*.42-fr.top).toFixed(0));
  }
  requestAnimationFrame(loop);
}
function onResize(){makeGrain();updateUI(false);}
addEventListener('resize',onResize);
onResize();requestAnimationFrame(loop);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>updateUI(false));
window.__mood={set:x=>setV(x,'key'),send};
})();
</script>
